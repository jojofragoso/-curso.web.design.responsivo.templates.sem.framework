<script type="module">

// ---------------- helpers ----------------
const PI = Math.PI, HP = PI / 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const k = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .85, ...o });
function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, typeof mat === 'number' ? M(mat) : mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; }

  const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 4, 512);

}
function makeScene(top, bottom, { shadow = 12, sun = [6, 12, 9], hemi = 1.6, dir = 2.3, fog = null, sunColor = 0xffffff } = {}) {

  const d = new THREE.DirectionalLight(sunColor, dir); d.position.set(...sun); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
  const c = d.shadow.camera; c.left = -shadow; c.right = shadow; c.top = shadow; c.bottom = -shadow; c.near = .5; c.far = 80;
  d.shadow.bias = -.0005; d.shadow.normalBias = .02; s.add(d, d.target);

}
const cam = (fov = 35) => new THREE.PerspectiveCamera(fov, W / H, .1, 300);
function shot(c, lt, dur, p0, p1, l0, l1, ease = eio) { const u = ease(k(lt, 0, dur)); c.position.lerpVectors(p0, p1, u); c.lookAt(new THREE.Vector3().lerpVectors(l0, l1, u)); }

// redesenha somente quando a "chave" muda
function paint(tex, key, fn) { if (tex.userData.key === key) return; tex.userData.key = key; fn(tex.userData.g, tex.image.width, tex.image.height); tex.needsUpdate = true; }

}

function text3d(str, size, color, depth = .5, mat) {

  const m = new THREE.Mesh(geo, mat || M(color, { roughness: .45 })); m.castShadow = true; return m;
}

}

  g.add(box(3.7, .2, .3, 0xffffff, 0, 1.4, 0), box(3.7, .2, .3, 0xffffff, 0, -1.4, 0), box(.2, 2.9, .3, 0xffffff, -1.75, 0, 0), box(.2, 2.9, .3, 0xffffff, 1.75, 0, 0), box(.12, 2.6, .25, 0xffffff, 0, 0, 0));
  g.userData.glass = glass; return g;
}
function bed() {
  const g = new THREE.Group();
  g.add(box(3, .9, 5, 0x7a4a26, 0, .45, 0));
  g.add(box(3.1, 2.4, .3, 0x6b3e1f, 0, 1.2, -2.55));

}
function alarmClock() {
  const g = new THREE.Group();
  g.add(box(1.1, .65, .45, 0x2b2d42, 0, .33, 0));
  const tex = canvasTex(256, 128); const scr = plane(.95, .45, tex); scr.position.set(0, .34, .23); g.add(scr);
  g.userData.set = (txt, col = '#ff4d4d', on = true) => paint(tex, txt + col + on, (c, w, h) => {
    c.fillStyle = '#0b0d14'; c.fillRect(0, 0, w, h);

  });

function nightstand() { return grp(box(1.4, 1.3, 1.2, 0x9a6a3a, 0, .65, 0), box(1.1, .08, .05, 0x6b4220, 0, .8, .61)); }
function deskSet({ laptop = true, monitor = false, deskColor = 0x8a5a2b } = {}) {
  const g = new THREE.Group();
  g.add(box(2.4, .16, 4, deskColor, 0, 2.3, 0));
  for (const z of [-1.8, 1.8]) g.add(box(2.2, 2.2, .14, 0x6b4220, 0, 1.12, z));
  const tex = canvasTex(512, 320);
  let scr;
  if (laptop) {
    g.add(box(1.0, .06, 1.5, 0x9aa3ad, -.1, 2.41, 0));
    const lid = new THREE.Group(); lid.position.set(.38, 2.43, 0); g.add(lid);
    lid.add(box(.06, 1.0, 1.5, 0x9aa3ad, 0, .5, 0));
    scr = plane(1.38, .88, tex); scr.rotation.y = -HP; scr.position.set(-.035, .5, 0); lid.add(scr);
    lid.rotation.z = -.15; g.userData.lid = lid;
  }
  if (monitor) {
    g.add(box(.5, .08, .7, 0x333333, .5, 2.42, 0), box(.12, .7, .12, 0x333333, .5, 2.8, 0));
    g.add(box(.12, 1.25, 2.1, 0x222222, .45, 3.5, 0));
    scr = plane(1.95, 1.1, tex); scr.rotation.y = -HP; scr.position.set(.38, 3.5, 0); g.add(scr);
    g.add(box(.7, .06, 1.6, 0x2b2b2b, -.4, 2.41, 0));
  }
  g.userData.tex = tex; g.userData.screen = scr;
  return g;
}
function chair(color = 0x3d405b) {
  const g = new THREE.Group();
  g.add(box(1.3, .2, 1.3, color, 0, 1.05, 0), box(.2, 1.7, 1.3, color, -.6, 1.95, 0), cyl(.1, .1, .9, 6, 0x333333, 0, .5, 0), box(1.2, .1, .14, 0x333333, 0, .08, 0), box(.14, .1, 1.2, 0x333333, 0, .08, 0));
  return g;
}
function phoneObj() {
  const g = new THREE.Group(); g.add(box(.36, .66, .06, 0x111111));
  const tex = canvasTex(180, 330); const s = plane(.32, .6, tex); s.position.z = .035; g.add(s); g.userData.tex = tex; return g;
}
function headset() {
  const g = new THREE.Group(); const m = M(0x222222);
  const band = mesh(new THREE.TorusGeometry(.66, .05, 5, 14, PI), m); band.position.y = .25; g.add(band);
  for (const sx of [-1, 1]) g.add(box(.12, .32, .32, m, sx * .66, .0, -.02));
  const boom = box(.04, .04, .55, m, -.66, -.22, .25); boom.rotation.y = -.35; g.add(boom);
  g.add(box(.1, .1, .1, M(0xe63946), -.56, -.22, .5)); return g;
}
function laptopScreen(tex, key, draw) { paint(tex, key, draw); }
function bubbleTex(text, { bg = '#fff', fg = '#111', border = '#111', w = 600, h = 300, size = 96, tail = true, think = false } = {}) {
  const t = canvasTex(w, h); paint(t, text, (g) => {
    g.fillStyle = bg; g.strokeStyle = border; g.lineWidth = 12;
    if (think) {
      g.beginPath(); g.ellipse(w / 2, h * .42, w * .46, h * .36, 0, 0, 2 * PI); g.fill(); g.stroke();
      [[.25, .86, .07], [.15, .95, .04]].forEach(([x, y, r]) => { g.beginPath(); g.arc(w * x, h * y, h * r, 0, 2 * PI); g.fill(); g.stroke(); });
    } else {
      rr(g, 12, 12, w - 24, h * .72, 50); g.fill(); g.stroke();
      if (tail) { g.beginPath(); g.moveTo(w * .35, h * .72); g.lineTo(w * .3, h * .97); g.lineTo(w * .5, h * .72); g.fill(); g.stroke(); g.fillRect(w * .35, h * .7 - 8, w * .15, 14); }
    }
    g.fillStyle = fg; g.font = font(size, 900); g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = text.split('\n'); lines.forEach((l, i) => g.fillText(l, w / 2, (think ? h * .42 : h * .37) + (i - (lines.length - 1) / 2) * size * 1.05));
  }); return t;
}
function iconTex(sym, bg, fg = '#fff', size = 256) {
  const t = canvasTex(size, size); paint(t, sym + bg, (g, w, h) => {
    g.fillStyle = bg; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 6, 0, 2 * PI); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 10; g.stroke();
    g.fillStyle = fg; g.font = font(w * .5, 900); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(sym, w / 2, h / 2 + 8);
  }); return t;
}
function paperTex(items, checked = [], reveal = 1, title = 'SÁBADO') {
  const t = canvasTex(600, 760);
  t.userData.draw = (rev, chk, hl = -1, dim = []) => paint(t, `${rev.toFixed(2)}|${chk}|${hl}|${dim}`, (g, w, h) => {
    g.fillStyle = '#fbf6e9'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#c9d6f0'; g.lineWidth = 3; for (let y = 150; y < h; y += 110) { g.beginPath(); g.moveTo(30, y + 40); g.lineTo(w - 30, y + 40); g.stroke(); }
    g.strokeStyle = '#f08080'; g.beginPath(); g.moveTo(80, 0); g.lineTo(80, h); g.stroke();
    g.fillStyle = '#1d3557'; g.font = 'italic 700 64px "DejaVu Serif"'; g.fillText(title, 110, 100);
    const n = items.length;
    items.forEach((it, i) => {
      const p = clamp(rev * n - i); if (p <= 0) return;
      const y = 180 + i * 110;
      g.save(); g.beginPath(); g.rect(90, y - 70, 520 * p, 110); g.clip();
      g.globalAlpha = dim.includes(i) ? .25 : 1;
      g.strokeStyle = '#1d3557'; g.lineWidth = 5; g.strokeRect(110, y - 26, 44, 44);
      g.fillStyle = i === hl ? '#e63946' : '#1d3557'; g.font = `italic 700 ${i === hl ? 60 : 52}px "DejaVu Serif"`; g.fillText(it, 176, y + 14);
      if (chk.includes(i)) { g.strokeStyle = '#2bb673'; g.lineWidth = 10; g.beginPath(); g.moveTo(112, y - 2); g.lineTo(130, y + 16); g.lineTo(160, y - 40); g.stroke(); }
      g.restore();
    });
  });
  t.userData.draw(reveal, checked); return t;
}
const TASKS = ['acordar cedo', 'correr', 'treinar', 'estudar', 'projeto'];
function timerObj() {
  const g = new THREE.Group();
  const body = cyl(1.3, 1.3, .4, 24, 0xe63946); body.rotation.x = HP; g.add(body);
  g.add(box(.35, .35, .3, 0xe63946, 0, 1.45, 0), box(.6, .18, .34, 0x333333, 0, 1.68, 0));
  const tex = canvasTex(400, 400); const face = new THREE.Mesh(new THREE.CircleGeometry(1.12, 32), new THREE.MeshBasicMaterial({ map: tex })); face.position.z = .21; g.add(face);
  g.userData.set = (sec, total = 300, col = '#e63946') => paint(tex, Math.floor(sec) + '|' + total + col, (c, w, h) => {
    c.fillStyle = '#fff'; c.fillRect(0, 0, w, h);
    const f = clamp(sec / total); c.fillStyle = col + '33'; c.beginPath(); c.moveTo(w / 2, h / 2); c.arc(w / 2, h / 2, w / 2, -HP, -HP + f * 2 * PI); c.fill();
    c.strokeStyle = col; c.lineWidth = 22; c.beginPath(); c.arc(w / 2, h / 2, w / 2 - 22, -HP, -HP + f * 2 * PI); c.stroke();
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    c.fillStyle = '#15171c'; c.font = font(110, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(`${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`, w / 2, h / 2 + 6);
  });
  g.userData.set(0); return g;
}
function calendarObj(days = 14, title = 'NOVEMBRO') {
  const g = new THREE.Group(); const tex = canvasTex(700, 640);
  g.add(box(3.6, 3.3, .12, 0xffffff)); const p = plane(3.5, 3.2, tex); p.position.z = .07; g.add(p);
  g.add(box(.2, .45, .2, 0x333333, -1.1, 1.7, .05), box(.2, .45, .2, 0x333333, 1.1, 1.7, .05));
  g.userData.set = (xs, red = [], prog = 1) => paint(tex, xs + '|' + red + '|' + prog.toFixed(2), (c, w, h) => {
    c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.fillStyle = '#e63946'; c.fillRect(0, 0, w, 110);
    c.fillStyle = '#fff'; c.font = font(64, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(title, w / 2, 58);
    const cols = 7; const cw = w / cols, ch = (h - 120) / Math.ceil(days / cols);
    for (let i = 0; i < days; i++) {
      const x = (i % cols) * cw, y = 120 + Math.floor(i / cols) * ch;
      c.strokeStyle = '#ddd'; c.lineWidth = 3; c.strokeRect(x + 4, y + 4, cw - 8, ch - 8);
      c.fillStyle = '#555'; c.font = font(34, 700); c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(String(i + 1), x + 14, y + 12);
      if (i < xs) {
        const pp = i === xs - 1 ? prog : 1; c.strokeStyle = '#2bb673'; c.lineWidth = 16; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x + 22, y + 30); c.lineTo(lerp(x + 22, x + cw - 22, Math.min(1, pp * 2)), lerp(y + 30, y + ch - 22, Math.min(1, pp * 2))); c.stroke();
        if (pp > .5) { c.beginPath(); c.moveTo(x + cw - 22, y + 30); c.lineTo(lerp(x + cw - 22, x + 22, (pp - .5) * 2), lerp(y + 30, y + ch - 22, (pp - .5) * 2)); c.stroke(); }
      }
      if (red.includes(i)) { c.fillStyle = 'rgba(230,57,70,.25)'; c.fillRect(x + 6, y + 6, cw - 12, ch - 12); }
    }
  });
  g.userData.set(0); return g;
}
function redX(s = 1) { const m = M(0xe63946, { roughness: .5 }); const a = box(2.2, .42, .3, m), b = box(2.2, .42, .3, m); a.rotation.z = PI / 4; b.rotation.z = -PI / 4; const g = grp(a, b); g.scale.setScalar(s); return g; }

function bulb() { const g = new THREE.Group(); const gl = mesh(new THREE.IcosahedronGeometry(.7, 1), M(0xffe066, { emissive: 0xffc300, emissiveIntensity: .8 })); gl.position.y = .5; g.add(gl, cyl(.32, .32, .45, 8, 0x9aa3ad, 0, -.25, 0)); return g; }
function trophy() { const m = goldMat(); return grp(cyl(.8, .35, 1.2, 10, m, 0, 1.5, 0), cyl(.12, .12, .6, 6, m, 0, .65, 0), box(1.1, .3, 1.1, 0x5a3a1e, 0, .2, 0), mesh(new THREE.TorusGeometry(.4, .08, 5, 10), m, -.85, 1.6, 0), mesh(new THREE.TorusGeometry(.4, .08, 5, 10), m, .85, 1.6, 0)); }

      rings.forEach((r, i) => { r.rotation.y = t * 2 + i; setS(r, pop(t, t0 + .4) * (1 - k(t, S0(32), S0(32) + .3))); });
      const fl = Math.abs(t - t0 - .9) < .1 || Math.abs(t - AT(32, .52)) < .1; bolts.forEach(b => b.visible = fl);
      debris.forEach(d => { const a = d.userData.a + t * d.userData.sp; d.position.set(Math.cos(a) * d.userData.r, d.userData.y, Math.sin(a) * d.userData.r); d.rotation.set(t, t * 2, 0); });
      shot(c, lt, t1 - t0, V(0, 5, 19), V(0, 5, 15), V(0, 3.4, 0), V(0, 3.6, 0));
    } };
  });

  // 33-34. Você não pode cancelar o dilúvio, mas pode salvar a sua família
  scene(33, (t0, t1) => {
    const s = makeScene('#1b263b', '#415a77', { shadow: 24, hemi: .9, fog: [0x3d5a80, 30, 90] }); const c = cam(38);
    s.add(box(100, .3, 100, 0x588157, 0, -.15, 0));
    const hills = []; for (let i = 0; i < 10; i++) { const h = mesh(new THREE.ConeGeometry(3 + rnd() * 3, 3 + rnd() * 4, 6), 0x6a994e, (rnd() - .5) * 60, 1.5, -10 - rnd() * 30); s.add(h); hills.push(h); }
    const houses = []; for (let i = 0; i < 8; i++) { const h = building(2, 2, 2, 0xe9dcc0, 0xb5523b); h.position.set((rnd() - .5) * 40, 0, (rnd() - .5) * 20 - 6); s.add(h); houses.push(h); }
    const water = ocean(140, 50, 0x2a6f97); s.add(water);
    const a = ark(); s.add(a);
    const fam = familyGroup(s); fam.forEach((p, i) => { a.add(p.root); p.root.position.set(-2.5 + i * 1.3, 4.25, 1.4); });
    const rain = rainSys(s, 260, 50, 22);
    const sunRays = new THREE.Mesh(new THREE.ConeGeometry(14, 30, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0xfff3b0, transparent: true, opacity: 0, side: THREE.DoubleSide })); sunRays.position.set(0, 14, -10); s.add(sunRays);
    const rb = new THREE.Group(); rb.position.set(0, 0, -40); s.add(rb); [0xe63946, 0xf39c12, 0xffd23f, 0x2bb673, 0x3a86ff, 0x8e44ad].forEach((col, i) => { const r = mesh(new THREE.TorusGeometry(26 - i * .9, .45, 4, 48, PI), M(col, { emissive: col, emissiveIntensity: .4 })); rb.add(r); });
    const hemi = s.userData.hemi, sun = s.userData.sun;
    title('VOCÊ NÃO PODE\nCANCELAR O DILÚVIO', 960, 170, t0 + .2, S0(34), 96, -2, '#ffffff');
    title('MAS PODE SALVAR\nSUA FAMÍLIA', 960, 170, S0(34) + .2, t1 + 1, 104, -2);
    sfx('rain', t0, .45, S0(34) + 1 - t0); sfx('thunder', t0 + .3, .6); sfx('water', t0, .5, t1 - t0); sfx('choir', S0(34), .55, t1 - S0(34)); sfx('success', AT(34, .8), .4);
    return { s, c, update(t) {
      const lt = t - t0; const lvl = eio(k(t, t0, S0(34) + .5)); water.position.y = lerp(-1, 5.2, lvl); water.userData.update(t);
      const calm = k(t, S0(34), AT(34, .8)); rain(t, 1 - calm);
      a.position.set(Math.sin(t * .4) * 1.5, Math.max(0, water.position.y - 1.2) + Math.sin(t * 1.4) * .2, 0); a.rotation.z = Math.sin(t * 1.1) * .05 * (1 - calm * .5); a.rotation.y = .3 + Math.sin(t * .3) * .1;
      fam.forEach((p, i) => { p.reset(); p.happy(); if (calm > .3) p.arms[1].sh.rotation.z = 2.6 + Math.sin(t * 8 + i) * .3; });
      sunRays.material.opacity = .2 * calm; hemi.intensity = lerp(.9, 1.8, calm); sun.intensity = lerp(1.2, 2.6, calm);
      if (calm > .1) s.background = s.userData.clear ||= gradTex('#4cc9f0', '#ffe8a3'); else s.background = s.userData.b0 ||= s.background;
      rb.scale.setScalar(Math.max(.001, calm)); rb.visible = calm > .02;
      shot(c, lt, t1 - t0, V(-18, 9, 26), V(4, 10, 24), V(0, 4, 0), V(0, 7, -6));
    } };
  });
}

function wrap(g, text, x, y, mw, lh) { const words = text.split(' '); let line = ''; for (const w of words) { const tl = line ? line + ' ' + w : w; if (g.measureText(tl).width > mw && line) { g.fillText(line, x, y); y += lh; line = w; } else line = tl; } if (line) g.fillText(line, x, y); }

// ---------------- montagem ----------------
const BUILT = [];
function buildAll() {
  defineScenes();
  SCENES.forEach((sc, i) => {
    const t0 = i === 0 ? 0 : Math.max(0, S0(sc.p0) - .3);
    const t1 = i < SCENES.length - 1 ? S0(SCENES[i + 1].p0) - .3 : DURATION;
    const b = sc.build(t0, t1); b.t0 = t0; b.t1 = t1; BUILT.push(b);
    if (i > 0) sfx('transition', t0, .25);
  });
}
function renderAt(t) {
  const sc = BUILT.find(s => t >= s.t0 && t < s.t1) || BUILT[BUILT.length - 1];
  sc.update(t); updateOverlays(t);
  flash.style.opacity = sc.t0 > 0 ? String(.35 * (1 - k(t - sc.t0, 0, .12))) : '0';
  renderer.render(sc.s, sc.c);
}
window.renderAt = renderAt;

(async () => {
  await document.fonts.load('96px "Lilita"'); await document.fonts.load('800 40px "Inter"');
  FONT = await new FontLoader().loadAsync('assets/helvetiker_bold.typeface.json');
  P = await (await fetch('timing.json')).json();
  DURATION = Math.ceil((P[P.length - 1].t1 + 2.5) * 10) / 10; window.DURATION = DURATION;
  buildAll();
  for (const b of BUILT) { b.update(b.t0 + .01); renderer.compile(b.s, b.c); }
  renderAt(0); window.READY = true;
  if (!RENDER_MODE) {
    const audio = document.getElementById('audio');
    const btn = document.createElement('div'); btn.id = 'play'; btn.textContent = '▶  Tocar'; stage.appendChild(btn);
    btn.onclick = () => { btn.remove(); audio.play(); (function loop() { renderAt(Math.min(audio.currentTime, DURATION - .01)); if (!audio.ended) requestAnimationFrame(loop); })(); };
  }
})();
</script>
