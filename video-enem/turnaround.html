<!doctype html><html><head><meta charset="utf-8"><title>Cláudio turnaround</title>
<style>html,body{margin:0;background:#d8dade}</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script></head><body>
<script type="module">
import * as THREE from 'three'; import { buildClaudio } from './claudio.js';
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(1920,1080); r.shadowMap.enabled=true; r.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0xd8dade);
s.add(new THREE.HemisphereLight(0xffffff,0x99a0aa,1.8)); const d=new THREE.DirectionalLight(0xffffff,2.2); d.position.set(4,9,8); d.castShadow=true; d.shadow.camera.left=-12;d.shadow.camera.right=12;d.shadow.camera.top=12;d.shadow.camera.bottom=-12; s.add(d);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,30),new THREE.MeshStandardMaterial({color:0xd0d2d6})); fl.rotation.x=-Math.PI/2; fl.receiveShadow=true; s.add(fl);
[[-5,0.5],[0,Math.PI/2*-1+0.0],[5,Math.PI]].forEach(([x,ry],i)=>{const c=buildClaudio(); c.root.position.x=x; c.root.rotation.y=i==0?0.35:i==1?-Math.PI/2:Math.PI+0.3; s.add(c.root);});
const cam=new THREE.PerspectiveCamera(30,16/9,.1,100); cam.position.set(0,4.2,22); cam.lookAt(0,3.3,0);
r.render(s,cam); window.READY=true;
</script></body></html>
