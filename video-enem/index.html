const PI = Math.PI, HP = PI / 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

}
function makeScene(top, bottom, { shadow = 12, sun = [6, 12, 9], hemi = 1.6, dir = 2.3, fog = null, sunColor = 0xffffff } = {}) {

}
const cam = (fov = 35) => new THREE.PerspectiveCamera(fov, W / H, .1, 300);

}

  const m = new THREE.Mesh(geo, mat || M(color, { roughness: .45 })); m.castShadow = true; return m;

function bed() {

  const g = new THREE.Group();
  g.add(box(1.1, .65, .45, 0x2b2d42, 0, .33, 0));
  const tex = canvasTex(256, 128); const scr = plane(.95, .45, tex); scr.position.set(0, .34, .23); g.add(scr);

function deskSet({ laptop = true, monitor = false, deskColor = 0x8a5a2b } = {}) {
  const g = new THREE.Group();
  g.add(box(2.4, .16, 4, deskColor, 0, 2.3, 0));

  const tex = canvasTex(512, 320);
  let scr;
  if (laptop) {
    g.add(box(1.0, .06, 1.5, 0x9aa3ad, -.1, 2.41, 0));
    const lid = new THREE.Group(); lid.position.set(.38, 2.43, 0); g.add(lid);
    lid.add(box(.06, 1.0, 1.5, 0x9aa3ad, 0, .5, 0));
    scr = plane(1.38, .88, tex); scr.rotation.y = -HP; scr.position.set(-.035, .5, 0); lid.add(scr);
    lid.rotation.z = -.15; g.userData.lid = lid;
  }
  if (monitor) {
    g.add(box(.5, .08, .7, 0x333333, .5, 2.42, 0), box(.12, .7, .12, 0x333333, .5, 2.8, 0));
    g.add(box(.12, 1.25, 2.1, 0x222222, .45, 3.5, 0));

    g.add(box(.7, .06, 1.6, 0x2b2b2b, -.4, 2.41, 0));

}
function chair(color = 0x3d405b) {

  g.add(box(1.3, .2, 1.3, color, 0, 1.05, 0), box(.2, 1.7, 1.3, color, -.6, 1.95, 0), cyl(.1, .1, .9, 6, 0x333333, 0, .5, 0), box(1.2, .1, .14, 0x333333, 0, .08, 0), box(.14, .1, 1.2, 0x333333, 0, .08, 0));
  return g;
}
function phoneObj() {
  const g = new THREE.Group(); g.add(box(.36, .66, .06, 0x111111));
  const tex = canvasTex(180, 330); const s = plane(.32, .6, tex); s.position.z = .035; g.add(s); g.userData.tex = tex; return g;
}
function headset() {
  const g = new THREE.Group(); const m = M(0x222222);
  const band = mesh(new THREE.TorusGeometry(.66, .05, 5, 14, PI), m); band.position.y = .25; g.add(band);
  for (const sx of [-1, 1]) g.add(box(.12, .32, .32, m, sx * .66, .0, -.02));
  const boom = box(.04, .04, .55, m, -.66, -.22, .25); boom.rotation.y = -.35; g.add(boom);
  g.add(box(.1, .1, .1, M(0xe63946), -.56, -.22, .5)); return g;
}
function laptopScreen(tex, key, draw) { paint(tex, key, draw); }
function bubbleTex(text, { bg = '#fff', fg = '#111', border = '#111', w = 600, h = 300, size = 96, tail = true, think = false } = {}) {
  const t = canvasTex(w, h); paint(t, text, (g) => {
    g.fillStyle = bg; g.strokeStyle = border; g.lineWidth = 12;
    if (think) {
      g.beginPath(); g.ellipse(w / 2, h * .42, w * .46, h * .36, 0, 0, 2 * PI); g.fill(); g.stroke();
      [[.25, .86, .07], [.15, .95, .04]].forEach(([x, y, r]) => { g.beginPath(); g.arc(w * x, h * y, h * r, 0, 2 * PI); g.fill(); g.stroke(); });
    } else {
      rr(g, 12, 12, w - 24, h * .72, 50); g.fill(); g.stroke();
      if (tail) { g.beginPath(); g.moveTo(w * .35, h * .72); g.lineTo(w * .3, h * .97); g.lineTo(w * .5, h * .72); g.fill(); g.stroke(); g.fillRect(w * .35, h * .7 - 8, w * .15, 14); }
    }
    g.fillStyle = fg; g.font = font(size, 900); g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = text.split('\n'); lines.forEach((l, i) => g.fillText(l, w / 2, (think ? h * .42 : h * .37) + (i - (lines.length - 1) / 2) * size * 1.05));
  }); return t;
}
function iconTex(sym, bg, fg = '#fff', size = 256) {
  const t = canvasTex(size, size); paint(t, sym + bg, (g, w, h) => {
    g.fillStyle = bg; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 6, 0, 2 * PI); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 10; g.stroke();
    g.fillStyle = fg; g.font = font(w * .5, 900); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(sym, w / 2, h / 2 + 8);
  }); return t;
}
function paperTex(items, checked = [], reveal = 1, title = 'SÁBADO') {
  const t = canvasTex(600, 760);
  t.userData.draw = (rev, chk, hl = -1, dim = []) => paint(t, `${rev.toFixed(2)}|${chk}|${hl}|${dim}`, (g, w, h) => {
    g.fillStyle = '#fbf6e9'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#c9d6f0'; g.lineWidth = 3; for (let y = 150; y < h; y += 110) { g.beginPath(); g.moveTo(30, y + 40); g.lineTo(w - 30, y + 40); g.stroke(); }
    g.strokeStyle = '#f08080'; g.beginPath(); g.moveTo(80, 0); g.lineTo(80, h); g.stroke();
    g.fillStyle = '#1d3557'; g.font = 'italic 700 64px "DejaVu Serif"'; g.fillText(title, 110, 100);
    const n = items.length;
    items.forEach((it, i) => {
      const p = clamp(rev * n - i); if (p <= 0) return;
      const y = 180 + i * 110;
      g.save(); g.beginPath(); g.rect(90, y - 70, 520 * p, 110); g.clip();
      g.globalAlpha = dim.includes(i) ? .25 : 1;
      g.strokeStyle = '#1d3557'; g.lineWidth = 5; g.strokeRect(110, y - 26, 44, 44);
      g.fillStyle = i === hl ? '#e63946' : '#1d3557'; g.font = `italic 700 ${i === hl ? 60 : 52}px "DejaVu Serif"`; g.fillText(it, 176, y + 14);
      if (chk.includes(i)) { g.strokeStyle = '#2bb673'; g.lineWidth = 10; g.beginPath(); g.moveTo(112, y - 2); g.lineTo(130, y + 16); g.lineTo(160, y - 40); g.stroke(); }
      g.restore();
    });
  });
  t.userData.draw(reveal, checked); return t;
}
const TASKS = ['acordar cedo', 'correr', 'treinar', 'estudar', 'projeto'];
function timerObj() {
  const g = new THREE.Group();
  const body = cyl(1.3, 1.3, .4, 24, 0xe63946); body.rotation.x = HP; g.add(body);
  g.add(box(.35, .35, .3, 0xe63946, 0, 1.45, 0), box(.6, .18, .34, 0x333333, 0, 1.68, 0));
  const tex = canvasTex(400, 400); const face = new THREE.Mesh(new THREE.CircleGeometry(1.12, 32), new THREE.MeshBasicMaterial({ map: tex })); face.position.z = .21; g.add(face);
  g.userData.set = (sec, total = 300, col = '#e63946') => paint(tex, Math.floor(sec) + '|' + total + col, (c, w, h) => {
    c.fillStyle = '#fff'; c.fillRect(0, 0, w, h);
    const f = clamp(sec / total); c.fillStyle = col + '33'; c.beginPath(); c.moveTo(w / 2, h / 2); c.arc(w / 2, h / 2, w / 2, -HP, -HP + f * 2 * PI); c.fill();
    c.strokeStyle = col; c.lineWidth = 22; c.beginPath(); c.arc(w / 2, h / 2, w / 2 - 22, -HP, -HP + f * 2 * PI); c.stroke();
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    c.fillStyle = '#15171c'; c.font = font(110, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(`${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`, w / 2, h / 2 + 6);
  });
  g.userData.set(0); return g;
}
function calendarObj(days = 14, title = 'NOVEMBRO') {
  const g = new THREE.Group(); const tex = canvasTex(700, 640);
  g.add(box(3.6, 3.3, .12, 0xffffff)); const p = plane(3.5, 3.2, tex); p.position.z = .07; g.add(p);
  g.add(box(.2, .45, .2, 0x333333, -1.1, 1.7, .05), box(.2, .45, .2, 0x333333, 1.1, 1.7, .05));
  g.userData.set = (xs, red = [], prog = 1) => paint(tex, xs + '|' + red + '|' + prog.toFixed(2), (c, w, h) => {
    c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.fillStyle = '#e63946'; c.fillRect(0, 0, w, 110);
    c.fillStyle = '#fff'; c.font = font(64, 900); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(title, w / 2, 58);
    const cols = 7; const cw = w / cols, ch = (h - 120) / Math.ceil(days / cols);
    for (let i = 0; i < days; i++) {
      const x = (i % cols) * cw, y = 120 + Math.floor(i / cols) * ch;
      c.strokeStyle = '#ddd'; c.lineWidth = 3; c.strokeRect(x + 4, y + 4, cw - 8, ch - 8);
      c.fillStyle = '#555'; c.font = font(34, 700); c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(String(i + 1), x + 14, y + 12);
      if (i < xs) {
        const pp = i === xs - 1 ? prog : 1; c.strokeStyle = '#2bb673'; c.lineWidth = 16; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x + 22, y + 30); c.lineTo(lerp(x + 22, x + cw - 22, Math.min(1, pp * 2)), lerp(y + 30, y + ch - 22, Math.min(1, pp * 2))); c.stroke();
        if (pp > .5) { c.beginPath(); c.moveTo(x + cw - 22, y + 30); c.lineTo(lerp(x + cw - 22, x + 22, (pp - .5) * 2), lerp(y + 30, y + ch - 22, (pp - .5) * 2)); c.stroke(); }
      }
      if (red.includes(i)) { c.fillStyle = 'rgba(230,57,70,.25)'; c.fillRect(x + 6, y + 6, cw - 12, ch - 12); }
    }
  });
  g.userData.set(0); return g;
}
function redX(s = 1) { const m = M(0xe63946, { roughness: .5 }); const a = box(2.2, .42, .3, m), b = box(2.2, .42, .3, m); a.rotation.z = PI / 4; b.rotation.z = -PI / 4; const g = grp(a, b); g.scale.setScalar(s); return g; }

function bulb() { const g = new THREE.Group(); const gl = mesh(new THREE.IcosahedronGeometry(.7, 1), M(0xffe066, { emissive: 0xffc300, emissiveIntensity: .8 })); gl.position.y = .5; g.add(gl, cyl(.32, .32, .45, 8, 0x9aa3ad, 0, -.25, 0)); return g; }

    return { s, c, update(t) {

      ck.position.set(2.4, topB.position.y + 1.2, 1.4); setS(ck, .9 * pop(t, t0 + .4)); ck.rotation.y = Math.sin(t * 2) * .3;
      glow.position.set(0, topB.position.y, 2); glow.intensity = 15 * k(lt, .3, .8);
      pct.position.set(out * 6, pct.userData.y, out * 1.5); pct.rotation.z = -out * .6;
      X.position.set(pct.position.x + 1.5, pct.userData.y, 1.4); setS(X, .9 * pop(t, AT(4, .55)));
      setSp(pctLab, pop(t, AT(4, .5)) * (1 - k(out, .5, 1))); pctLab.position.x = pct.position.x;
      const wob = k(t, AT(4, .7), t1); bl.forEach((b, i) => { if (b === pct) return; b.position.x = Math.sin(t * 9 + i) * .08 * wob * i; b.rotation.z = Math.sin(t * 7) * .03 * wob * i / 6; if (i > 1) b.position.y = b.userData.y - wob * .5 * 1.08; });
      if (t < AT(4, .5)) shot(c, lt, AT(4, .5) - t0, V(0, 8, 17), V(1, 8.5, 15), V(0, 5.5, 0), V(0, 6, 0));
      else shot(c, t - AT(4, .5), t1 - AT(4, .5), V(3, 5, 16), V(1, 5, 17), V(1.5, 3.5, 0), V(1, 4, 0));
    } };
  });

  // 5. Não acha que você é um gênio
  scene(5, (t0, t1) => {
    const s = makeScene('#7209b7', '#b5179e', { shadow: 10 }); const c = cam(40);
    s.add(mesh(new THREE.CylinderGeometry(5, 5.3, .5, 24), 0x560bad, 0, -.25, 0));
    const ch = hero(); s.add(ch.root);
    const crown = new THREE.Group(); const gm = goldMat(); crown.add(cyl(.75, .75, .45, 10, gm, 0, 0, 0)); for (let i = 0; i < 5; i++) { const a = i / 5 * 2 * PI; crown.add(mesh(new THREE.ConeGeometry(.18, .5, 4), gm, Math.cos(a) * .62, .45, Math.sin(a) * .62)); } s.add(crown);
    const lab = labelSprite('GÊNIO?', { bg: '#ffd23f', size: 90 }); lab.position.set(0, 10, 0); s.add(lab);
    const X = redX(1.4); X.position.set(0, 9.9, .6); s.add(X);
    sfx('sparkle', t0 + .2, .5); sfx('buzz', AT(5, .55), .6);
    return { s, c, update(t) {
      const lt = t - t0; ch.reset(); const no = t > AT(5, .55);
      if (!no) { ch.happy(); ch.arms.forEach((a, i) => a.sh.rotation.z = (i ? 1 : -1) * 2.6); } else { ch.sad(); ch.head.rotation.y = Math.sin(t * 9) * .3; }
      const f = k(t, AT(5, .55), AT(5, .9)); crown.position.set(f * 2.5, lerp(7.9, 0.3, f * f), f * 1); crown.rotation.set(0, t * 2, f * 2.5); setS(crown, pop(t, t0 + .15));
      setSp(lab, pop(t, t0 + .3)); setS(X, 1.4 * pop(t, AT(5, .55)));
      shot(c, lt, t1 - t0, V(0, 7, 15), V(0, 6.5, 13), V(0, 5.5, 0), V(0, 6, 0)); shake(c, no ? .05 * (1 - f) : 0, t);
    } };
  });

  // 6. Ele assume que você chutou (chute literal)
  scene(6, (t0, t1) => {
    const s = makeScene('#2b9348', '#80b918', { shadow: 12 }); const c = cam(42);
    s.add(box(40, .3, 40, 0x55a630, 0, -.15, 0)); for (let i = -3; i <= 3; i++) s.add(box(.15, .32, 40, 0xffffff, i * 4, -.13, 0));
    const ch = hero(); ch.root.position.set(-2, 0, 2); ch.root.rotation.y = HP - .3; s.add(ch.root);
    const b = ball(); s.add(b);
    const gate = grp(box(.25, 4, .25, 0xffffff, -3, 2, 0), box(.25, 4, .25, 0xffffff, 3, 2, 0), box(6.25, .25, .25, 0xffffff, 0, 4, 0)); gate.position.set(5, 0, -8); s.add(gate);
    title('CHUTOU!', 540, 1640, AT(6, .35), t1, 130, -4);
    sfx('kick', AT(6, .3), .8); sfx('whistle', AT(6, .6), .5); sfx('crowd', t0, .3, t1 - t0);
    return { s, c, update(t) {
      const lt = t - t0; ch.reset(); ch.happy();
      const kick = k(t, AT(6, .1), AT(6, .3)); ch.legs[1].hip.rotation.x = -Math.sin(kick * PI) * 1.4; ch.arms[0].sh.rotation.x = Math.sin(kick * PI) * 1;
      const fly = k(t, AT(6, .3), t1); b.position.set(lerp(-1.2, 5, fly), .5 + Math.sin(fly * PI) * 5, lerp(2.8, -8, fly)); b.rotation.set(t * 10, t * 7, 0);
      c.position.set(-7 + lt * .8, 5, 14); c.lookAt(b.position.x * .5, 3, b.position.z * .4);
    } };
  });

  // 7. O valor da difícil despenca quase a zero
  scene(7, (t0, t1) => {
    const s = makeScene('#03071e', '#370617', { shadow: 12, hemi: 1 }); const c = cam(44);
    const plat = mesh(new THREE.CylinderGeometry(4, 4.3, 1, 20), 0x6a040f, 0, -.5, 0); s.add(plat);
    const hb = qBlock(LVL.hard, 'DIFÍCIL'); hb.position.y = 1.3; s.add(hb);
    const val = scoreSprite(600, 260, .8); val.position.set(0, 5.8, 0); s.add(val);
    const arrow = grp(box(.8, 3, .4, M(0xe63946, { emissive: 0x6a040f }), 0, 0, 0), mesh(new THREE.ConeGeometry(1, 1.4, 4), M(0xe63946, { emissive: 0x6a040f }), 0, -2.1, 0)); arrow.children[1].rotation.x = PI; arrow.position.set(3.2, 6, 0); s.add(arrow);
    pill('VALOR DA QUESTÃO', 'red', 540, 300, t0 + .2, t1);
    sfx('drop', AT(7, .25), .6); sfx('falling', AT(7, .3), .5); sfx('impact', AT(7, .85), .5);
    return { s, c, update(t) {
      const lt = t - t0; const f = eio(k(t, AT(7, .25), AT(7, .8)));

      setSp(val, pop(lt, .1)); val.position.y = 5.8 - f * 1.2;
      hb.position.y = 1.3 - k(t, AT(7, .5), t1) * k(t, AT(7, .5), t1) * 18; hb.rotation.z = k(t, AT(7, .5), t1) * 1.5;
      arrow.position.y = 6 - ((lt * 2) % 2); setS(arrow, pop(lt, .3));
      shot(c, lt, t1 - t0, V(0, 6, 13), V(0, 3, 15), V(0, 4, 0), V(0, 2, 0)); shake(c, f > 0 && f < 1 ? .05 : 0, t);
    } };
  });

  // 8. Pula a pedreira e garante fáceis e médias: base sólida
  scene(8, (t0, t1) => {
    const s = makeScene('#e9f5db', '#cfe1b9', { shadow: 16 }); const c = cam(44);
    s.add(box(50, .3, 40, 0x97a97c, 0, -.15, 0));
    const rock = mesh(new THREE.DodecahedronGeometry(2.4, 0), 0x6c757d, 0, 2, 0); rock.scale.set(1, .85, 1); s.add(rock);
    const rl = labelSprite('DIFÍCIL', { bg: '#e63946', fg: '#fff', size: 70 }); rl.position.set(0, 5, 0); s.add(rl);
    const ch = hero(); s.add(ch.root);
    const base = []; const tb = AT(8, .45);
    [['FÁCIL', 'easy'], ['FÁCIL', 'easy'], ['FÁCIL', 'easy'], ['MÉDIA', 'mid'], ['MÉDIA', 'mid']].forEach(([l, lv], i) => { const b = qBlock(LVL[lv], l); b.position.set(7, .55 + i * 1.08, 0); b.userData.t = tb + i * .35; s.add(b); base.push(b); });
    pill('PULE A PEDREIRA', 'red', 540, 300, t0 + .2, tb); pill('GARANTA FÁCEIS E MÉDIAS', 'green', 540, 300, tb, AT(8, .85)); title('BASE SÓLIDA', 540, 1640, AT(8, .85), t1, 120, -3);
    sfx('jump', AT(8, .15), .6); sfx('thud', AT(8, .32), .4); base.forEach(b => sfx('thud', b.userData.t + .3, .45)); sfx('success', AT(8, .88), .5);
    return { s, c, update(t) {
      const lt = t - t0; ch.reset(); ch.happy(); ch.root.rotation.y = HP;
      const j = k(t, AT(8, .05), AT(8, .32)); const x = lerp(-7, 4.5, k(t, t0, AT(8, .4)));
      ch.root.position.set(x, Math.sin(j * PI) * 4.2, 0); if (j > 0 && j < 1) { ch.legs.forEach(l => { l.hip.rotation.x = -1; l.knee.rotation.x = 1.4; }); ch.arms.forEach((a, i) => a.sh.rotation.z = (i ? 1 : -1) * 2.6); } else if (t < AT(8, .4)) ch.run(t * 10);
      if (t > AT(8, .4)) { ch.root.rotation.y = HP - .4; ch.arms[1].sh.rotation.z = 2.4 + Math.sin(t * 6) * .3; }
      base.forEach(b => { const f = eo(k(t, b.userData.t, b.userData.t + .4)); b.visible = t > b.userData.t; b.position.y = (b.userData.y0 ??= b.position.y) + (1 - f) * 8; });
      rl.position.y = 5 + Math.sin(t * 2) * .2;
      if (t < AT(8, .4)) { c.position.set(x - 1, 6, 15); c.lookAt(x + 2, 3, 0); } else { const u = eio(k(t, AT(8, .4), t1)); c.position.set(lerp(3.5, 6, u), lerp(6, 5, u), lerp(15, 13, u)); c.lookAt(lerp(5.5, 6.5, u), 3.2, 0); }
    } };
  });

  // 9. O algoritmo entende que é real e paga o máximo
  scene(9, (t0, t1) => {
    const s = makeScene('#081c15', '#1b4332', { shadow: 12 }); const c = cam(44);
    s.add(mesh(new THREE.CylinderGeometry(7, 7.4, .5, 24), 0x2d6a4f, 0, -.25, 0));
    const bl = towerBlocks(s); bl.forEach(b => b.position.x = -1.2);
    const arch = new THREE.Group(); s.add(arch); arch.position.set(-1.2, 0, 0);
    const scanM = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: .5 }); const scan = new THREE.Mesh(new THREE.BoxGeometry(4, .1, 2.6), scanM); arch.add(scan);
    const cks = bl.map((b, i) => { const k2 = check3d(.45); k2.position.set(1.2, b.userData.y, 1.2); s.add(k2); return k2; });
    const coins = []; for (let i = 0; i < 30; i++) { const cn = cyl(.35, .35, .1, 16, goldMat()); cn.rotation.x = HP; cn.userData = { x: (rnd() - .5) * 10, z: (rnd() - .5) * 4 + 1, d: rnd() * 1.5, sp: 3 + rnd() * 2 }; s.add(cn); coins.push(cn); }
    const sc = scoreSprite(600, 260, .65); sc.position.set(2.6, 9.2, 1); s.add(sc);
    const ch = hero(); ch.root.position.set(3.4, 0, 1.5); ch.root.rotation.y = -.4; s.add(ch.root);
    pill('CONHECIMENTO REAL', 'green', 540, 300, t0 + .4, t1); title('PONTUAÇÃO MÁXIMA', 540, 1640, AT(9, .5), t1, 104, -3);
    sfx('scan', t0 + .2, .45, 2); cks.forEach((_, i) => sfx('ding', t0 + .6 + i * .3, .3)); sfx('coins', AT(9, .5), .6, t1 - AT(9, .5)); sfx('success', AT(9, .5), .5);
    return { s, c, update(t) {
      const lt = t - t0; scan.position.y = (lt * 3.5) % 8;
      cks.forEach((k2, i) => { setS(k2, .45 * pop(t, t0 + .6 + i * .3)); k2.rotation.y = Math.sin(t * 2 + i) * .4; });
      const cf = t - AT(9, .5); coins.forEach(cn => { const tt = cf - cn.userData.d; cn.visible = tt > 0; if (tt > 0) { cn.position.set(cn.userData.x, 14 - ((tt * cn.userData.sp) % 15), cn.userData.z); cn.rotation.set(HP + tt * 3, tt * 4, 0); } });
      sc.userData.set(String(Math.round(lerp(480, 790, eo(k(t, t0 + .6, AT(9, .9)))))), '#d8f3dc', '#1b4332', 'SUA NOTA'); setSp(sc, pop(t, t0 + .5));
      ch.reset(); ch.happy(); ch.arms.forEach((a, i) => a.sh.rotation.z = (i ? 1 : -1) * (2.4 + Math.sin(t * 8 + i) * .3)); ch.body.position.y = Math.abs(Math.sin(t * 6)) * .3 * k(t, AT(9, .5), AT(9, .55));
      shot(c, lt, t1 - t0, V(0, 7, 20), V(1, 7, 18), V(.5, 5.5, 0), V(.8, 6, 0));
    } };
  });

  // 10. Teimosia custa a sua vaga
  scene(10, (t0, t1) => {
    const s = makeScene('#ffb4a2', '#ffe5d9', { shadow: 14 }); const c = cam(44);
    s.add(box(40, .3, 30, 0xe5989b, 0, -.15, 0));
    const wall = new THREE.Group(); wall.position.set(0, 0, -1.5); s.add(wall);
    for (let r = 0; r < 6; r++) for (let i = 0; i < 4; i++) wall.add(box(1.4, .7, 1, 0xb5523b, (i - 1.5) * 1.45 + (r % 2) * .35, .36 + r * .72, 0));
    const wl = labelSprite('QUESTÃO DIFÍCIL', { bg: '#e63946', fg: '#fff', size: 60, w: 600 }); wl.position.set(0, 5.2, -.8); s.add(wl);
    const ch = hero(); s.add(ch.root);
    const stars = []; for (let i = 0; i < 5; i++) { const st = mesh(new THREE.OctahedronGeometry(.2), M(0xffd23f, { emissive: 0xffaa00 })); s.add(st); stars.push(st); }
    const seat = new THREE.Group(); seat.add(box(1.6, .25, 1.6, 0x3a86ff, 0, 1.4, 0), box(1.6, 1.8, .25, 0x3a86ff, 0, 2.3, -.7), cyl(.1, .1, 1.3, 6, 0x333333, 0, .7, 0)); s.add(seat);
    const sl = labelSprite('SUA VAGA', { bg: '#3a86ff', fg: '#fff', size: 70 }); s.add(sl);
    pill('TEIMOSIA', 'red', 540, 300, t0 + .2, t1);
    for (let i = 0; i < 3; i++) sfx('bonk', t0 + .5 + i * .65, .6); sfx('whoosh', AT(10, .7), .5); sfx('sad', AT(10, .72), .5);
    return { s, c, update(t) {
      const lt = t - t0; ch.reset(); ch.angry(); ch.root.rotation.y = PI;
      const ph = ((lt - .2) / .65) % 1; const hit = lt > .2 && lt < 2.3; const lean = hit ? Math.max(0, Math.sin(ph * PI)) : 0;
      ch.root.position.set(0, 0, 1.8 - lean * .7); ch.torso.rotation.x = lean * .5;
      stars.forEach((st, i) => { const a = i / 5 * 2 * PI + t * 4; st.position.set(Math.cos(a) * .9, 7 + Math.sin(t * 6 + i) * .1, 1.3 + Math.sin(a) * .9); st.visible = lt > .6; });
      const go = k(t, AT(10, .65), t1); seat.position.set(4 + go * 8, 0, 3 - go * 6); seat.rotation.y = go * 3; sl.position.set(seat.position.x, 4.4, seat.position.z); setSp(sl, pop(lt, .3) * (1 - go));
      shot(c, lt, t1 - t0, V(4, 7, 18), V(6, 7, 16), V(1.5, 4, 0), V(2.5, 4, 0));
    } };
  });

  // 11. Pule a difícil, garanta a base, volte se sobrar tempo
  scene(11, (t0, t1) => {
    const s = makeScene('#caf0f8', '#ade8f4', { shadow: 14 }); const c = cam(44);
    s.add(mesh(new THREE.CylinderGeometry(7, 7.4, .5, 24), 0x48cae4, 0, -.25, 0));
    const bl = towerBlocks(s); bl.forEach(b => b.position.x = 2.2);
    const ch = hero(); ch.root.position.set(-2.4, 0, 1.6); ch.root.rotation.y = .3; s.add(ch.root);
    const wc = wallClock(); wc.position.set(-2.4, 10.5, -1); wc.scale.setScalar(.9); s.add(wc);
    const tA = AT(11, .02), tB = AT(11, .32), tC = AT(11, .62);
    pill('1. PULE A DIFÍCIL SEM DÓ', 'red', 540, 280, tA, t1 + 1); pill('2. GARANTA A BASE', 'green', 540, 385, tB, t1 + 1); pill('3. VOLTE SE SOBRAR TEMPO', 'blue', 540, 490, tC, t1 + 1);
    sfx('pop', tA, .5); sfx('pop', tB, .5); sfx('pop', tC, .5); sfx('tick', tC, .3, 2); sfx('success', AT(11, .92), .6);
    return { s, c, update(t) {
      const lt = t - t0;
      bl.forEach((b, i) => { const lv = b.userData.lv; let f;
        if (lv === 'hard') { f = 1 - k(t, tA + .2, tA + .6) + k(t, tC + .4, tC + 1.2); b.position.x = 2.2 + (1 - Math.min(1, f)) * 6; b.position.y = b.userData.y; }
        else { const d = tB + i * .15; f = eo(k(t, d, d + .35)); b.position.y = b.userData.y + (1 - f) * 8 * (t > tB ? 1 : 0); b.visible = true; } });
      ch.reset(); ch.happy(); ch.arms[1].sh.rotation.z = t > AT(11, .9) ? 2.7 : 1.2 + Math.sin(t * 3) * .2;
      wc.userData.mm.rotation.z = -t * 2; wc.userData.hm.rotation.z = -t * .2; setS(wc, .9 * pop(t, tC));
      shot(c, lt, t1 - t0, V(0, 7, 19), V(0, 6.5, 17), V(0, 5, 0), V(0, 5.2, 0));
    } };
  });
}
function wrap(g, text, x, y, mw, lh) { const words = text.split(' '); let line = ''; for (const w of words) { const tl = line ? line + ' ' + w : w; if (g.measureText(tl).width > mw && line) { g.fillText(line, x, y); y += lh; line = w; } else line = tl; } if (line) g.fillText(line, x, y); }

// ---------------- montagem ----------------
const BUILT = [];
function buildAll() {
  defineScenes();
  SCENES.forEach((sc, i) => {
    const t0 = i === 0 ? 0 : Math.max(0, S0(sc.p0) - .3);
    const t1 = i < SCENES.length - 1 ? S0(SCENES[i + 1].p0) - .3 : DURATION;
    const b = sc.build(t0, t1); b.t0 = t0; b.t1 = t1; BUILT.push(b);
    if (i > 0) sfx('transition', t0, .25);
  });
}
function renderAt(t) {
  const sc = BUILT.find(s => t >= s.t0 && t < s.t1) || BUILT[BUILT.length - 1];
  sc.update(t); updateOverlays(t);
  flash.style.opacity = sc.t0 > 0 ? String(.35 * (1 - k(t - sc.t0, 0, .12))) : '0';
  renderer.render(sc.s, sc.c);
}
window.renderAt = renderAt;

(async () => {
  await document.fonts.load('96px "Lilita"'); await document.fonts.load('800 40px "Inter"');
  FONT = await new FontLoader().loadAsync('assets/helvetiker_bold.typeface.json');
  P = await (await fetch('timing.json')).json();
  DURATION = Math.ceil((P[P.length - 1].t1 + 2.5) * 10) / 10; window.DURATION = DURATION;
  buildAll();
  for (const b of BUILT) { b.update(b.t0 + .01); renderer.compile(b.s, b.c); }
  renderAt(0); window.READY = true;
  if (!RENDER_MODE) {
    const audio = document.getElementById('audio');
    const btn = document.createElement('div'); btn.id = 'play'; btn.textContent = '▶  Tocar'; stage.appendChild(btn);
    btn.onclick = () => { btn.remove(); audio.play(); (function loop() { renderAt(Math.min(audio.currentTime, DURATION - .01)); if (!audio.ended) requestAnimationFrame(loop); })(); };
  }
})();
</script>
