<script type="module">
import * as THREE from 'three';
import { FontLoader } from './lib/FontLoader.js';
import { TextGeometry } from './lib/TextGeometry.js';

const W = 1080, H = 1920, DURATION = 99.2;
const RENDER_MODE = new URLSearchParams(location.search).has('render');
const stage = document.getElementById('stage');
const ui = document.getElementById('ui');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);

function fit() {

  stage.style.transform = `scale(${s})`;
  stage.style.left = (innerWidth - W * s) / 2 + 'px';
}
if (!RENDER_MODE) { addEventListener('resize', fit); fit(); }

// ---------- helpers ----------
const PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const k = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .45) => back(k(t, a, a + d));
const lerp = (a, b, x) => a + (b - a) * x;
const rnd = (() => { let s = 1234567; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .85, metalness: 0, ...o });
function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, typeof mat === 'number' ? M(mat) : mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}
const box = (w, h, d, c, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), c, x, y, z);
function setScale(o, s) { s = Math.max(s, 0.0001); o.scale.setScalar(s); o.visible = s > 0.001; }

function gradTex(top, bottom) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function makeScene(top, bottom, { fog = null, shadow = 8, sun = [5, 10, 7], hemi = 1.7, dir = 2.4 } = {}) {
  const s = new THREE.Scene();
  s.background = gradTex(top, bottom);
  if (fog) s.fog = new THREE.Fog(fog[0], fog[1], fog[2]);
  s.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, hemi));
  const d = new THREE.DirectionalLight(0xffffff, dir);
  d.position.set(...sun); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
  const c = d.shadow.camera; c.left = -shadow; c.right = shadow; c.top = shadow; c.bottom = -shadow; c.near = .5; c.far = 60;
  d.shadow.bias = -0.0006; d.shadow.normalBias = 0.02;
  s.add(d, d.target);
  return s;
}
const cam = (fov = 40) => new THREE.PerspectiveCamera(fov, W / H, 0.1, 200);

// ---------- texturas ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  t.userData = { canvas: c, ctx: g }; return t;
}
function coinFace(base, dark, label, labelSize = 250) {
  return canvasTex(512, 512, (g) => {
    g.fillStyle = dark; g.fillRect(0, 0, 512, 512);
    g.fillStyle = base; g.beginPath(); g.arc(256, 256, 230, 0, 2 * PI); g.fill();
    g.strokeStyle = dark; g.lineWidth = 10; g.beginPath(); g.arc(256, 256, 200, 0, 2 * PI); g.stroke();
    g.fillStyle = dark;
    for (let i = 0; i < 36; i++) { const a = i / 36 * 2 * PI; g.beginPath(); g.arc(256 + Math.cos(a) * 218, 256 + Math.sin(a) * 218, 6, 0, 2 * PI); g.fill(); }
    g.font = `900 ${labelSize}px "DejaVu Serif", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, 256, 268);
  });
}
const SILVER = ['#e3e7ec', '#8d97a3'], GOLD = ['#ffd451', '#c98b1c'];
const faceCache = {};
function coin(r = 1, h = .18, metal = SILVER, label = '8', size) {
  const key = metal[0] + label;
  const ft = faceCache[key] || (faceCache[key] = coinFace(metal[0], metal[1], label, size));
  const side = M(metal[1], { metalness: .3, roughness: .5 });
  const face = new THREE.MeshStandardMaterial({ map: ft, roughness: .45, metalness: .25 });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 32), [side, face, face]);
  m.castShadow = m.receiveShadow = true;
  const g = new THREE.Group(); m.rotation.x = PI / 2; g.add(m); return g;
}

// ---------- tipografia 3D ----------
let FONT;
function text3d(str, size, color, depth = .35, mat) {
  const geo = new TextGeometry(str, { font: FONT, size, height: depth, curveSegments: 6, bevelEnabled: true, bevelThickness: .06, bevelSize: .04, bevelSegments: 2 });
  geo.computeBoundingBox(); const b = geo.boundingBox;
  geo.translate(-(b.max.x + b.min.x) / 2, -(b.max.y + b.min.y) / 2, -(b.max.z + b.min.z) / 2);
  const m = new THREE.Mesh(geo, mat || M(color, { roughness: .5 }));
  m.castShadow = m.receiveShadow = true; return m;
}
const goldMat = () => M(0xf5c03a, { roughness: .35, metalness: .35, emissive: 0x3a2500 });

// ---------- objetos low poly ----------
function cloud(s = 1) {
  const g = new THREE.Group(); const mat = M(0xffffff, { roughness: 1 });
  [[0, 0, 0, 1], [1.1, -.1, .1, .8], [-1.1, -.15, 0, .75], [.4, .45, -.1, .7], [-.5, .35, .2, .65]].forEach(([x, y, z, r]) => {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), mat); m.position.set(x, y, z); m.scale.y = .7; g.add(m);
  });
  g.scale.setScalar(s); return g;
}
function ocean(size = 80, seg = 46, color = 0x2a8fd6) {
  const geo = new THREE.PlaneGeometry(size, size, seg, seg); geo.rotateX(-PI / 2);
  const p = geo.attributes.position; const base = p.array.slice();
  const m = new THREE.Mesh(geo, M(color, { roughness: .45, metalness: .05 })); m.receiveShadow = true;
  m.userData.update = (t) => {
    for (let i = 0; i < p.count; i++) {
      const x = base[i * 3], z = base[i * 3 + 2];
      p.array[i * 3 + 1] = Math.sin(x * .55 + t * 1.6) * .16 + Math.cos(z * .7 + t * 1.1) * .16 + Math.sin((x + z) * .3 + t) * .08;
    }
    p.needsUpdate = true;
  };
  m.userData.update(0); return m;
}
function ground(size, color, amp = .12, seg = 30) {
  const geo = new THREE.PlaneGeometry(size, size, seg, seg); geo.rotateX(-PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, (rnd() - .5) * amp);
  const m = new THREE.Mesh(geo, M(color)); m.receiveShadow = true; return m;
}
function person({ coat = 0x8a4b2a, pants = 0x2b3a67, hat = 0x2a2a2a, skin = 0xf2c29b, trim = 0xf5c03a } = {}) {
  const g = new THREE.Group();
  for (const sx of [-1, 1]) {
    g.add(box(.3, .9, .32, pants, sx * .18, .55, 0));
    g.add(box(.34, .16, .44, 0x1d1d22, sx * .18, .08, .05));
  }
  g.add(box(.86, 1.05, .5, coat, 0, 1.5, 0));
  g.add(box(.3, .95, .04, 0xffffff, 0, 1.52, .26));
  g.add(box(.88, .14, .52, 0x3a2a1a, 0, 1.08, 0));
  g.add(box(.16, .14, .05, trim, 0, 1.08, .27));
  const arms = [];
  for (const sx of [-1, 1]) {
    const a = new THREE.Group(); a.position.set(sx * .56, 1.95, 0);
    a.add(box(.24, .85, .28, coat, 0, -.42, 0));
    a.add(box(.2, .2, .22, skin, 0, -.92, 0));
    g.add(a); arms.push(a);
  }
  const head = new THREE.Group(); head.position.y = 2.4; g.add(head);
  head.add(box(.74, .72, .68, skin, 0, 0, 0));
  head.add(box(.78, .2, .72, 0x4a2d18, 0, .3, -.02));
  for (const sx of [-1, 1]) {
    head.add(box(.1, .15, .03, 0x111111, sx * .16, .04, .35));
    head.add(box(.13, .07, .02, 0xff9b9b, sx * .25, -.12, .345));
  }
  head.add(box(.18, .05, .03, 0x7a2b1d, 0, -.18, .35));
  const hatG = new THREE.Group(); hatG.position.y = .46; head.add(hatG);
  const brim = mesh(new THREE.CylinderGeometry(.62, .66, .14, 3), hat); brim.rotation.y = PI / 6 + PI; hatG.add(brim);
  hatG.add(mesh(new THREE.CylinderGeometry(.32, .38, .34, 6), hat, 0, .2, 0));
  hatG.add(mesh(new THREE.CylinderGeometry(.385, .385, .07, 6), trim, 0, .1, 0));
  return { g, armL: arms[0], armR: arms[1], head };
}
function quill() {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(.025, .01, .9, 5), 0x3b2a1a, 0, .45, 0));
  const f = mesh(new THREE.ConeGeometry(.16, .8, 4), M(0xfafafa)); f.position.y = .75; f.scale.z = .25; g.add(f);
  return g;
}
function ship({ hull = 0x7a4a26, sail = 0xf3ead2, pirate = true } = {}) {
  const g = new THREE.Group();
  const sh = new THREE.Shape(); sh.moveTo(-2.3, .7); sh.lineTo(2.5, .7); sh.lineTo(1.7, -.45); sh.lineTo(-1.8, -.45); sh.lineTo(-2.3, .7);
  const hg = new THREE.ExtrudeGeometry(sh, { depth: 1.3, bevelEnabled: false }); hg.translate(0, 0, -.65);
  g.add(mesh(hg, hull));
  g.add(box(4.9, .12, 1.36, 0x4e2e16, .1, .62, 0));
  g.add(box(1.3, .7, 1.2, hull, -1.6, 1.0, 0));
  for (let i = 0; i < 4; i++) g.add(box(.18, .18, .05, 0x222222, -.9 + i * .7, .2, .67));
  const sailM = M(sail);
  [[-.5, 3.4], [1.0, 3.0]].forEach(([x, hgt]) => {
    g.add(mesh(new THREE.CylinderGeometry(.07, .08, hgt, 6), 0x5a3a1e, x, .7 + hgt / 2, 0));
    const s1 = box(.08, 1.0, 1.5, sailM, x + .12, 1.75, 0); s1.scale.x = 1; g.add(s1);
    const s2 = box(.08, .8, 1.2, sailM, x + .12, 2.85, 0); g.add(s2);
  });
  if (pirate) {
    const ft = canvasTex(128, 96, (c) => {
      c.fillStyle = '#16161a'; c.fillRect(0, 0, 128, 96); c.fillStyle = '#fff';
      c.beginPath(); c.arc(64, 40, 20, 0, 2 * PI); c.fill(); c.fillRect(54, 52, 20, 12);
      c.fillStyle = '#16161a'; c.beginPath(); c.arc(56, 40, 6, 0, 2 * PI); c.arc(72, 40, 6, 0, 2 * PI); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 8; c.beginPath(); c.moveTo(34, 64); c.lineTo(94, 88); c.moveTo(94, 64); c.lineTo(34, 88); c.stroke();
    });
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(.9, .65), new THREE.MeshStandardMaterial({ map: ft, side: THREE.DoubleSide }));
    flag.rotation.y = PI / 2; flag.position.set(-.5, 4.4, .45); g.add(flag);
  }
  return g;
}
function chest() {
  const g = new THREE.Group();
  g.add(box(2.2, 1.1, 1.3, 0x8a5a2b, 0, .55, 0));
  for (const x of [-.8, .8]) g.add(box(.16, 1.14, 1.34, 0xf0b93a, x, .55, 0));
  g.add(box(.36, .36, .06, 0xf0b93a, 0, .8, .67));
  const lid = new THREE.Group(); lid.position.set(0, 1.1, -.65); g.add(lid);
  const lg = new THREE.CylinderGeometry(.65, .65, 2.2, 8, 1, false, 0, PI); lg.rotateZ(PI / 2); lg.translate(0, 0, .65);
  lid.add(mesh(lg, 0x7a4c22));
  for (let i = 0; i < 26; i++) {
    const c = coin(.22, .06, SILVER); c.rotation.set(-PI / 2 + (rnd() - .5) * .9, rnd() * 6, 0);
    c.position.set((rnd() - .5) * 1.8, 1.08 + rnd() * .22, (rnd() - .5) * 1.0); g.add(c);
  }
  return { g, lid };
}
function redX(s = 1) {
  const g = new THREE.Group(); const mat = M(0xe63946, { roughness: .5 });
  const a = box(2.2, .42, .3, mat); a.rotation.z = PI / 4; const b = box(2.2, .42, .3, mat); b.rotation.z = -PI / 4;
  g.add(a, b); g.scale.setScalar(s); return g;
}
function checkMark(s = 1) {
  const g = new THREE.Group(); const mat = M(0x2bb673, { roughness: .5 });
  const a = box(.9, .4, .3, mat, -.45, -.1, 0); a.rotation.z = -PI / 4;
  const b = box(1.8, .4, .3, mat, .35, .35, 0); b.rotation.z = PI / 3.6;
  g.add(a, b); g.scale.setScalar(s); return g;
}
function column(h = 5, color = 0xf1e6cc) {
  const g = new THREE.Group();
  g.add(box(1.5, .35, 1.5, color, 0, .175, 0));
  g.add(mesh(new THREE.CylinderGeometry(.62, .62, .25, 10), color, 0, .47, 0));
  g.add(mesh(new THREE.CylinderGeometry(.5, .56, h, 10), color, 0, .6 + h / 2, 0));
  g.add(mesh(new THREE.CylinderGeometry(.66, .52, .3, 10), color, 0, .75 + h, 0));
  g.add(box(1.55, .3, 1.55, color, 0, 1.05 + h, 0));
  const crown = mesh(new THREE.CylinderGeometry(.35, .5, .5, 5), 0xf5c03a, 0, 1.45 + h, 0); g.add(crown);
  return g;
}
function ribbon(cx, h0, h1, r, turns, width, mat, phase = 0) {
  const n = 120, pos = [], idx = [], uv = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, a = phase + u * turns * 2 * PI, y = lerp(h0, h1, u);
    const x = cx + Math.sin(a) * r, z = Math.cos(a) * r;
    pos.push(x, y - width / 2, z, x, y + width / 2, z); uv.push(u, 0, u, 1);
    if (i < n) { const j = i * 2; idx.push(j, j + 2, j + 1, j + 1, j + 2, j + 3); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx); geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; return m;
}
function stopwatch() {
  const g = new THREE.Group();
  const body = mesh(new THREE.CylinderGeometry(1, 1, .35, 16), 0xe63946); body.rotation.x = PI / 2; g.add(body);
  const face = mesh(new THREE.CylinderGeometry(.82, .82, .38, 16), 0xffffff); face.rotation.x = PI / 2; g.add(face);
  g.add(box(.3, .3, .3, 0xe63946, 0, 1.1, 0)); g.add(box(.5, .15, .3, 0x333333, 0, 1.3, 0));
  for (let i = 0; i < 12; i++) { const a = i / 12 * 2 * PI; g.add(box(.06, .14, .05, 0x333333, Math.sin(a) * .68, Math.cos(a) * .68, .2)); }
  const hand = new THREE.Group(); hand.position.z = .22; hand.add(box(.08, .6, .05, 0x111111, 0, .28, 0)); g.add(hand);
  return { g, hand };
}
function magnifier() {
  const g = new THREE.Group();
  g.add(mesh(new THREE.TorusGeometry(1.1, .16, 8, 24), 0x333a44));
  const lens = new THREE.Mesh(new THREE.CircleGeometry(1.05, 24), new THREE.MeshStandardMaterial({ color: 0xbfe6ff, transparent: true, opacity: .35, roughness: .1 }));
  g.add(lens);
  const hnd = box(.32, 1.6, .32, 0x6b3e1f, 0, -1.95, 0); g.add(hnd);
  g.rotation.z = .6; return g;
}
function parchment(w, h, cw = 1024) {
  const ch = Math.round(cw * h / w);
  const tex = canvasTex(cw, ch, () => {});
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: .9 }));
  m.receiveShadow = true;
  const g = tex.userData.ctx;
  function bg() {
    g.fillStyle = '#efdcae'; g.fillRect(0, 0, cw, ch);
    g.strokeStyle = 'rgba(140,100,40,.35)'; g.lineWidth = 3;
    for (let y = ch * .18; y < ch; y += ch * .14) { g.beginPath(); g.moveTo(cw * .06, y); g.lineTo(cw * .94, y); g.stroke(); }
    g.strokeStyle = '#b89656'; g.lineWidth = 16; g.strokeRect(8, 8, cw - 16, ch - 16);
  }
  bg(); tex.needsUpdate = true;
  return { m, g, tex, cw, ch, bg };

// texto manuscrito revelado da esquerda para a direita
function writeLine(p, str, x, y, size, prog, color = '#3a2208') {
  const g = p.g; g.save();
  g.font = `italic 700 ${size}px "DejaVu Serif", serif`; g.textBaseline = 'alphabetic';
  const w = g.measureText(str).width;
  g.beginPath(); g.rect(x - 10, y - size * 1.2, (w + 20) * prog, size * 1.6); g.clip();
  g.fillStyle = color; g.fillText(str, x, y); g.restore();

}
function scribble(p, lines, prog) {
  const g = p.g; g.strokeStyle = '#3a2208'; g.lineWidth = 6; g.lineCap = 'round';
  const total = lines.length; const per = 1 / total;
  for (let l = 0; l < total; l++) {
    const lp = clamp((prog - l * per) / per); if (lp <= 0) break;
    const y = lines[l]; g.beginPath();
    const x0 = p.cw * .1, x1 = p.cw * .1 + p.cw * .78 * lp;
    for (let x = x0; x <= x1; x += 4) {
      const yy = y + Math.sin(x * .09 + l) * 14 + Math.sin(x * .23) * 8 - (Math.sin(x * .05 + l * 3) > .85 ? 20 : 0);
      if (x === x0) g.moveTo(x, yy); else g.lineTo(x, yy);
    }
    g.stroke();

}
function desk() {
  const g = new THREE.Group();
  g.add(box(6, .3, 3.2, 0x8a5a2b, 0, 2.0, 0));
  for (const [x, z] of [[-2.7, -1.3], [2.7, -1.3], [-2.7, 1.3], [2.7, 1.3]]) g.add(box(.3, 2, .3, 0x6b4220, x, 1, z));

  return g;
}
function globe(r = 2.4) {
  const geo = new THREE.IcosahedronGeometry(r, 3).toNonIndexed();
  const p = geo.attributes.position; const cols = []; const v = new THREE.Vector3(); const c = new THREE.Color();
  for (let i = 0; i < p.count; i += 3) {
    v.set(0, 0, 0); for (let j = 0; j < 3; j++) v.add(new THREE.Vector3().fromBufferAttribute(p, i + j)); v.normalize();
    const f = Math.sin(v.x * 3.1 + .5) + Math.sin(v.y * 4.2 + 1.3) * .8 + Math.sin(v.z * 3.7 + 2.1) + Math.sin((v.x + v.z) * 5) * .4;
    if (Math.abs(v.y) > .88) c.set(0xf4f8ff); else if (f > .55) c.set(f > 1.4 ? 0x3e9a48 : 0x5cbf5a); else c.set(0x2f7fd0);
    for (let j = 0; j < 3; j++) cols.push(c.r, c.g, c.b);
  }

// ---------- rótulos (DOM) ----------
const COLORS = { red: '#e63946', orange: '#f39c12', green: '#2bb673', blue: '#3a86ff' };
const overlays = [];
function pill(text, color, x, y, t0, t1) {
  const el = document.createElement('div'); el.className = 'pill'; el.textContent = text;
  el.style.setProperty('--c', COLORS[color] || color); ui.appendChild(el);
  overlays.push({ el, x, y, t0, t1, rot: 0 });
}
function title(text, x, y, t0, t1, size = 120, rot = -4, color) {
  const el = document.createElement('div'); el.className = 'title'; el.textContent = text; el.style.fontSize = size + 'px';
  if (color) el.style.color = color; ui.appendChild(el);
  overlays.push({ el, x, y, t0, t1, rot });
}
function updateOverlays(t) {
  for (const o of overlays) {
    const vis = t >= o.t0 && t < o.t1;
    o.el.style.display = vis ? 'flex' : 'none';
    if (!vis) continue;
    const s = Math.min(pop(t, o.t0, .35), 1 - eo(k(t, o.t1 - .18, o.t1)));
    o.el.style.left = o.x + 'px'; o.el.style.top = o.y + 'px';
    o.el.style.transform = `translate(-50%,-50%) rotate(${o.rot}deg) scale(${Math.max(s, 0)})`;
  }
}

  // 11. P = peso (singular), S = pesos (plural)
  addScene(41.0, 47.0, () => {
    const s = makeScene('#0f4c5c', '#4fb3a9', { shadow: 7 }); const c = cam(40); c.position.set(0, 1.5, 13);

  // 12. Letras juntas, uma sobre a outra, para economizar tempo
  addScene(47.0, 53.4, () => {

  // 13. P + S viram $
  addScene(53.4, 61.8, () => {
    const s = makeScene('#1b2a49', '#3c5a99', { shadow: 6 }); const c = cam(38); c.position.set(0, .3, 12);
    const pMat = M(0x3a86ff, { roughness: .5 }), sMat = M(0xff8a3d, { roughness: .5 });
    const S = text3d('S', 3.6, 0, .7, sMat); s.add(S);

    const bar = box(.5, 3.6, .7, pMat); Pg.add(bar);
    const bowlG = new THREE.TorusGeometry(.7, .25, 6, 18, PI); bowlG.rotateZ(-PI / 2);
    const bowl = mesh(bowlG, pMat, .25, .85, 0); bowl.scale.z = 1.4; Pg.add(bowl);
    const glow = []; for (let i = 0; i < 16; i++) { const g2 = mesh(new THREE.OctahedronGeometry(.18), M(0xffe28a, { emissive: 0xffc300 })); s.add(g2); glow.push(g2); }

      setScale(Pg, pop(lt, 0)); setScale(S, pop(lt, .25));

      S.position.set(lerp(1.5, 0, merge), 0, 0);

      bar.material.color.lerpColors(new THREE.Color(0x3a86ff), new THREE.Color(0xf5c03a), gold);

      const hl = lt < 2.4 ? 1 + Math.max(0, Math.sin(lt * 8)) * .06 * (lt > .3 ? 1 : 0) : 1;
      bar.scale.x *= hl;
      const rot = Math.sin(lt * 1.2) * .25 * (1 - gold) + (gold > 0 ? eio(k(lt, 7.0, 8.4)) * 2 * PI : 0);
      S.rotation.y = rot; Pg.rotation.y = rot;
      glow.forEach((g2, i) => { const a = i / 16 * 2 * PI + lt; setScale(g2, pop(lt, 6.8 + i * .03)); g2.position.set(Math.cos(a) * 3.4, Math.sin(a) * 3.4, -1); g2.rotation.y = lt * 3; });

  // 15. Colunas de Hércules
  addScene(63.7, 74.2, () => {
    const s = makeScene('#ff9e5e', '#ffd6a5', { shadow: 12, sun: [-6, 8, 6], fog: [0xffd6a5, 30, 80] }); const c = cam(42);
    const sea = ocean(100, 54, 0x2b7fc4); s.add(sea);
    const c1 = column(6), c2 = column(6); c1.position.set(-3, -.3, 0); c2.position.set(3, -.3, 0); s.add(c1, c2);
    for (const cc of [c1, c2]) { const rock = mesh(new THREE.DodecahedronGeometry(1.6, 0), 0x8a7a6a, 0, -.6, 0); rock.scale.y = .5; cc.add(rock); }
    const banTex = canvasTex(1024, 96, (g) => { g.fillStyle = '#d62828'; g.fillRect(0, 0, 1024, 96); g.fillStyle = '#ffd23f'; g.fillRect(0, 0, 1024, 10); g.fillRect(0, 86, 1024, 10); g.fillStyle = '#fff'; g.font = '800 54px "Inter"'; g.textBaseline = 'middle'; for (let x = 20; x < 1024; x += 512) g.fillText('PLUS ULTRA', x, 50); });
    banTex.wrapS = THREE.RepeatWrapping;
    const banMat = new THREE.MeshStandardMaterial({ map: banTex, side: THREE.DoubleSide, roughness: .7 });
    const r1 = ribbon(-3, 1.6, 5.6, .8, 1.6, .55, banMat, PI), r2 = ribbon(3, 1.6, 5.6, .8, 1.6, .55, banMat, 0);

    for (const [x, y, z, sc] of [[-8, 10, -25, 2], [9, 12, -30, 2.4]]) { const cl = cloud(sc); cl.position.set(x, y, z); s.add(cl); }

    return { scene: s, camera: c, update(t) {

      const wrap = k(lt, 4.0, 6.0);
      for (const r of [r1, r2]) { r.geometry.setDrawRange(0, Math.floor(wrap * 120) * 6); r.visible = wrap > 0; }
      banTex.offset.x = -lt * .05;
      // navio atravessa entre as colunas
      const u = k(lt, 6.5, 10.5); sh.position.set(Math.sin(u * 2) * .3, -.1 + Math.sin(t * 1.5) * .1, lerp(-22, 9, u)); sh.visible = u > 0 && u < 1;
      const a = lerp(.35, -.2, eio(k(lt, 0, 10.5)));
      c.position.set(Math.sin(a) * 15, lerp(3, 4.6, k(lt, 0, 10)), Math.cos(a) * 15); c.lookAt(0, 3, 0);
    } };

  // 16. Origem ainda não comprovada
  addScene(74.2, 79.6, () => {
    const s = makeScene('#2b2d42', '#5c677d', { shadow: 6 }); const c = cam(40); c.position.set(0, 7, 7); c.lookAt(0, 0, 0);
    s.add(box(14, .4, 10, 0x6b4220, 0, -.2, 0));
    const par = parchment(6, 4); par.m.rotation.x = -PI / 2; par.m.position.y = .02; s.add(par.m);
    par.bg(); const g = par.g;
    g.fillStyle = '#3a2208'; g.font = '900 360px "DejaVu Serif"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('$', par.cw * .32, par.ch * .52);
    g.font = 'italic 700 120px "DejaVu Serif"'; g.fillText('ps', par.cw * .72, par.ch * .45); g.fillText('P+S?', par.cw * .72, par.ch * .75);

  // 17. Não começou necessariamente como um S cortado
  addScene(79.6, 83.9, () => {
    const s = makeScene('#0b6e4f', '#58c49a', { shadow: 6 }); const c = cam(38); c.position.set(0, .3, 12);
    const S = text3d('S', 3.8, 0xff8a3d, .7); s.add(S);

  // 18. Abreviação usada há centenas de anos
  addScene(83.9, 89.3, () => {
    const d = deskScene({ top: '#8d5524', bottom: '#e0ac69', coat: 0x1b4965 });
    const cand = new THREE.Group(); cand.add(mesh(new THREE.CylinderGeometry(.18, .18, .8, 8), 0xfff3d6, 0, .4, 0)); const fl = mesh(new THREE.ConeGeometry(.12, .35, 6), M(0xffb703, { emissive: 0xff8800 }), 0, .98, 0); cand.add(fl); cand.position.set(-2.3, 2.15, -.5); d.s.add(cand);
    const pl = new THREE.PointLight(0xffb347, 6, 8); pl.position.set(-2.3, 3.4, -.3); d.s.add(pl);
    pill('ABREVIAÇÃO', 'orange', 540, 380, 84.6, 87.2);
    pill('HÁ CENTENAS DE ANOS', 'blue', 540, 380, 87.3, 89.3);
    return { scene: d.s, camera: d.c, update(t) {

      d.par.tex.needsUpdate = true;
      const x = -1.7 + (d.par.cw * .08 + w1 * prog) / d.par.cw * 3.4;
      d.q.position.set(x, 2.16, .3); d.q.rotation.set(-.5, 0, -.5);
      d.p.armR.rotation.set(-1.2, 0, .3 - prog * .6); d.p.head.rotation.x = .35;
      fl.scale.y = 1 + Math.sin(t * 17) * .12;
      d.c.position.set(.8 - lt * .3, 6.6, 8); d.c.lookAt(0, 3, 0);
    } };
  });

  // 19. Final: atravessaram oceanos e impérios -> símbolo universal
  addScene(89.3, DURATION, () => {
    const s = makeScene('#2a6df4', '#9ad8ff', { shadow: 14, fog: [0x9ad8ff, 30, 90] }); const c = cam(42);
    const sea = ocean(120, 60); s.add(sea);
    const ships = [ship(), ship({ pirate: false, sail: 0xffffff }), ship({ pirate: false, sail: 0xffe0a8, hull: 0x5a3a1e })];
    ships.forEach((sh, i) => { sh.position.set(-8 + i * 8, 0, -6 - i * 5); sh.rotation.y = .4 - i * .3; s.add(sh); });
    const P = text3d('P', 3, 0x3a86ff, .7), S = text3d('S', 3, 0xff8a3d, .7); s.add(P, S);
    const D = text3d('$', 6.5, 0, 1.2, goldMat()); s.add(D);
    const rain = []; for (let i = 0; i < 40; i++) { const cn = coin(.45, .12, GOLD, '$', 260); cn.userData = { x: (rnd() - .5) * 14, z: (rnd() - .5) * 6 + 2, d: rnd() * 2.5, sp: 4 + rnd() * 3 }; s.add(cn); rain.push(cn); }
    for (const [x, y, z, sc] of [[-7, 14, -25, 2.4], [8, 16, -30, 2.6], [0, 19, -36, 3]]) { const cl = cloud(sc); cl.position.set(x, y, z); s.add(cl); }
    pill('OCEANOS', 'blue', 540, 380, 90.1, 91.4); pill('IMPÉRIOS', 'red', 540, 380, 91.4, 92.6); pill('GERAÇÕES', 'green', 540, 380, 92.6, 94.4);
    title('SÍMBOLO UNIVERSAL', 540, 300, 95.6, DURATION + 1, 104, -3);
    title('DO DINHEIRO', 540, 420, 96.4, DURATION + 1, 104, -3);
    return { scene: s, camera: c, update(t) {
      const lt = t - this.t0; sea.userData.update(t);
      ships.forEach((sh, i) => { sh.position.x = -8 + i * 8 + lt * .6; sh.position.y = Math.sin(t * 1.4 + i) * .15; });
      const fly = eio(k(lt, 0, 3.5));
      P.position.set(lerp(-6, -1.6, fly), lerp(1, 6, fly), lerp(2, 0, fly)); S.position.set(lerp(6, 1.6, fly), lerp(1, 6, fly), lerp(2, 0, fly));
      const merge = eio(k(lt, 4.0, 5.4));
      P.position.x = lerp(P.position.x, 0, merge); S.position.x = lerp(S.position.x, 0, merge);
      const showD = k(lt, 5.3, 5.9);
      setScale(P, pop(lt, 0) * (1 - showD)); setScale(S, pop(lt, .2) * (1 - showD));
      P.rotation.y = S.rotation.y = lt * 1.2;
      setScale(D, back(showD)); D.position.set(0, 6.2 + Math.sin(lt * 1.5) * .25, 0); D.rotation.y = Math.sin(lt * .9) * .5;
      rain.forEach(cn => { const u = cn.userData; const tt = lt - 6.2 - u.d; cn.visible = tt > 0; if (tt > 0) { cn.position.set(u.x, 16 - ((tt * u.sp) % 18), u.z); cn.rotation.set(tt * 3, tt * 4, 0); } });
      const up = eio(k(lt, 0, 6));
      c.position.set(Math.sin(lt * .12) * 3, lerp(2.5, 6.5, up), lerp(16, 19, up)); c.lookAt(0, lerp(2.5, 6, up), 0);
    } };
  });
}

// ---------- render ----------
let current = null;
function renderAt(t) {
  const sc = SCENES.find(s => t >= s.t0 && t < s.t1) || SCENES[SCENES.length - 1];
  sc.update(t);
  updateOverlays(t);
  // pequeno "flash" de transição a cada corte
  const since = t - sc.t0; flash.style.opacity = sc.t0 > 0 ? String(.55 * (1 - k(since, 0, .14))) : '0';
  renderer.render(sc.scene, sc.camera);
  current = sc;
}
window.renderAt = renderAt;
window.DURATION = DURATION;

(async () => {
  await document.fonts.load('120px "Lilita"');
  await document.fonts.load('800 40px "Inter"');
  FONT = await new FontLoader().loadAsync('assets/helvetiker_bold.typeface.json');
  buildAll();
  // compila tudo antes de começar
  for (const sc of SCENES) { sc.update(sc.t0 + .01); renderer.compile(sc.scene, sc.camera); }
  renderAt(0);
  window.READY = true;
  if (!RENDER_MODE) {
    const audio = document.getElementById('audio');
    const btn = document.createElement('div'); btn.id = 'play'; btn.textContent = '▶  Tocar'; stage.appendChild(btn);
    btn.onclick = () => { btn.remove(); audio.currentTime = 0; audio.play(); loop(); };
    function loop() { renderAt(Math.min(audio.currentTime || 0, DURATION - .01)); if (!audio.ended) requestAnimationFrame(loop); }
  }
})();
</script>
