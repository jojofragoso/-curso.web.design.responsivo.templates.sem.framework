<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:P;src:url(Poppins-Black.ttf);font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#17213a;font-family:P,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.navy{position:absolute;inset:0;background:#17213a}
.blob{position:absolute;border-radius:50%;background:#1f2c4d}
.phone{position:absolute;left:110px;top:150px;width:500px;height:1000px;background:#fff;border-radius:58px;border:12px solid #0d0d12;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);transform-origin:50% 50%}
.notch{position:absolute;left:50%;top:10px;width:120px;height:30px;margin-left:-60px;background:#0d0d12;border-radius:20px;z-index:5}
.sbar{height:52px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 4px;font-weight:700;font-size:17px;color:#111}
.ighead{display:flex;align-items:center;gap:12px;padding:14px 18px;font-weight:700;font-size:19px;color:#111}
.av{width:42px;height:42px;border-radius:50%;background:#d9926a;border:2px solid #e1306c;flex:none}
.post{width:100%;height:476px;position:relative;overflow:hidden}
.icons{display:flex;gap:20px;padding:14px 18px 6px;align-items:center}
.likes{padding:2px 18px;font-weight:700;font-size:18px;color:#111}
.cap{padding:4px 18px;font-size:17px;color:#111;font-weight:600}
.cap span{font-weight:400}
.date{padding:8px 18px;font-size:16px;color:#888;font-weight:600;display:inline-block;margin-left:10px;border-radius:10px}
.finger{position:absolute;width:70px;height:300px;background:#e8a678;border-radius:35px 35px 10px 10px;border:3px solid #c98559;z-index:9}
.finger:after{content:"";position:absolute;left:14px;top:12px;width:40px;height:44px;border-radius:18px 18px 12px 12px;background:#f2c3a0}
.chathead{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #eee;font-weight:700;font-size:19px;color:#111}
.chathead small{display:block;font-weight:600;font-size:13px;color:#2bb24c}
.msgs{position:absolute;left:0;right:0;top:118px;bottom:300px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.m{max-width:80%;padding:14px 20px;border-radius:24px;font-size:25px;font-weight:600;line-height:1.3}
.m.in{align-self:flex-start;background:#efefef;color:#111;border-bottom-left-radius:6px}
.m.out{align-self:flex-end;background:#3797f0;color:#fff;border-bottom-right-radius:6px}
.tstamp{align-self:center;font-size:16px;color:#999;font-weight:600}
.input{position:absolute;left:14px;right:14px;bottom:18px;height:52px;border-radius:26px;background:#f1f1f1;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 22px;color:#999;font-size:17px;font-weight:600}
.send{width:38px;height:38px;border-radius:50%;background:#3797f0}
.q{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#ffd23f;border:8px solid #fff;color:#1b1b1b;font-weight:900}
.badge{background:#131a2c;border:3px solid #fff;border-radius:14px;color:#fff;text-align:center;font-weight:800}
</style></head>
<body><div id="stage"></div>
<script>
const S=document.getElementById('stage');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const pop=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const heart=(fill)=>`<svg width="36" height="34" viewBox="0 0 24 22"><path d="M12 21s-8.5-5.3-10.6-10.2C-.1 6.7 2.6 2 6.9 2c2.3 0 3.9 1.3 5.1 3 1.2-1.7 2.8-3 5.1-3 4.3 0 7 4.7 5.5 8.8C20.5 15.7 12 21 12 21z" fill="${fill?'#ed2b4a':'none'}" stroke="${fill?'#ed2b4a':'#111'}" stroke-width="2"/></svg>`;
const ic=(d)=>`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round">${d}</svg>`;
const bubble=ic('<path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-5A8.5 8.5 0 1 1 21 11.5z"/>');
const plane=ic('<path d="M22 3L9.5 13.5M22 3l-7 19-5.5-8.5L1 9z"/>');
const bg=()=>`<div class="navy"></div><div class="blob" style="width:700px;height:700px;left:380px;top:700px"></div><div class="blob" style="width:420px;height:420px;left:-200px;top:-120px"></div>`;
const beach=`<svg width="476" height="476" viewBox="0 0 476 476">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a62"/><stop offset=".55" stop-color="#ffd27a"/><stop offset=".56" stop-color="#3fb2c8"/><stop offset="1" stop-color="#2c8fb0"/></linearGradient></defs>
<rect width="476" height="476" fill="url(#sk)"/><circle cx="330" cy="250" r="52" fill="#ffe7a0"/>
<rect y="380" width="476" height="96" fill="#f3d39b"/>
<path d="M70 476 L88 250 L100 250 L92 476Z" fill="#7a4a2b"/>
<g fill="#2f8a4a"><path d="M94 252 q-70 -30 -90 20 q50 -30 90 -20z"/><path d="M94 252 q60 -60 110 -10 q-60 -20 -110 10z"/><path d="M94 252 q-10 -70 -60 -80 q40 30 60 80z"/></g>
<g transform="translate(230 170)"><path d="M-48 300 L-30 120 L30 120 L48 300Z" fill="#f6c21c"/><circle cx="-14" cy="180" r="5" fill="#e04a3a"/><circle cx="16" cy="220" r="5" fill="#e04a3a"/><circle cx="-6" cy="260" r="5" fill="#e04a3a"/>
<rect x="-12" y="88" width="24" height="36" fill="#c98559"/><ellipse cx="0" cy="62" rx="44" ry="52" fill="#3b2418"/><circle cx="0" cy="66" r="34" fill="#d9926a"/><path d="M-40 50 q40 -50 80 0 q-20 -18 -40 -16 q-20 -2 -40 16z" fill="#3b2418"/><circle cx="-11" cy="66" r="4" fill="#222"/><circle cx="11" cy="66" r="4" fill="#222"/><path d="M-10 82 q10 9 20 0" stroke="#7a2e22" stroke-width="3" fill="none"/></g></svg>`;

const scenes={
// 7.7s: like, zoom on date, unlike
insta(t){
  const liked = t>0.75 && t<7.05;
  const z = t<2.4?1: 1+0.75*ease((t-2.4)/0.6) - (t>5.6? 0.75*ease((t-5.6)/0.6):0);
  const oy = t<2.4?0: -330*ease((t-2.4)/0.6) + (t>5.6? 330*ease((t-5.6)/0.6):0);
  const hl = t>3.0 && t<5.6;
  // finger: tap at 0.7 and 6.9
  let fy=1400, fx=126;
  const tap=(c)=>{const d=t-c; if(d<-0.6||d>0.5) return null; return d<0? 1400-(1400-842)*ease((d+0.6)/0.55) : 842+40*Math.sin(cl(d/0.12)*Math.PI)+ (d>0.2? (d-0.2)/0.3*560:0)};
  const a=tap(0.7), b=tap(6.9); if(a!==null) fy=a; if(b!==null) fy=b;
  const hs = liked? 1+0.35*Math.sin(cl((t-0.75)/0.3)*Math.PI):1;
  return bg()+`<div class="phone" style="transform-origin:12% 80%;transform:translate(${-oy*0.35}px,${oy*0.6}px) scale(${z})"><div class="notch"></div>
  <div class="sbar"><span>3:12</span><span>▮▮ ◔</span></div>
  <div style="text-align:center;font-weight:800;font-size:19px;padding:4px 0 2px">Publicações</div>
  <div class="ighead"><div class="av"></div><div>bia.moura<div style="font-size:13px;font-weight:600;color:#666">Arraial do Cabo, RJ</div></div></div>
  <div class="post">${beach}</div>
  <div class="icons"><span style="display:inline-block;transform:scale(${hs})">${heart(liked)}</span>${bubble}${plane}</div>
  <div class="likes">${liked?88:87} curtidas</div>
  <div class="cap">bia.moura <span>fase franja, nunca mais 🙈</span></div>
  <div class="cap" style="color:#888;font-weight:600">Ver todos os 12 comentários</div>
  <div class="date" style="${hl?'background:#ffd23f;color:#111;font-size:22px;transform:scale(1.15);transform-origin:left':''}">14 de março de 2019</div>
  </div><div class="finger" style="left:${fx}px;top:${fy}px"></div>`;
},
// chat scenes
chat(t, msgs, time, extra=''){
  let h='';
  for(const m of msgs){ if(t<m.at) continue; const p=pop((t-m.at)/0.3);
    h+= m.ts? `<div class="tstamp" style="opacity:${cl((t-m.at)/0.2)}">${m.ts}</div>` : `<div class="m ${m.o?'out':'in'}" style="transform:scale(${p});transform-origin:${m.o?'right':'left'} bottom">${m.x}</div>`;}
  return bg()+`<div class="phone" style="transform:scale(1.12)"><div class="notch"></div><div class="sbar"><span>${time}</span><span>▮▮ ◔</span></div>
  <div class="chathead"><span style="font-size:28px">‹</span><div class="av"></div><div>bia.moura<small>online</small></div></div>
  <div class="msgs">${h}</div><div class="input">Mensagem...<div class="send"></div></div></div>${extra}`;
},
chat1(t){return scenes.chat(t,[
  {ts:'Última conversa: 2016',at:0.1},
  {x:'parabéns pela formatura!! 🎓',at:0.2},
  {x:'valeu! boa sorte aí',o:1,at:0.35},
  {ts:'Hoje 3:13',at:3.2},
  {x:'mals, curti sem querer 😅',o:1,at:3.3},
  {x:'kkkkkk relaxa',at:4.5},
  {x:'cláudio?? da escola??',at:4.9}],'3:14');},
chat2(t){return scenes.chat(t,[
  {x:'lembra da prova de física? kkk',at:0},
  {x:'até hoje tenho trauma',o:1,at:0},
  {x:'kkkkkkkkk',at:0},
  {ts:'6:41',at:0},
  {x:'seu perfil não tem nenhuma foto sua',at:0.4},
  {x:'me manda uma? 👀',at:1.3}],'6:41');},
send(t){return scenes.chat(t,[
  {x:'seu perfil não tem nenhuma foto sua',at:0},
  {x:'me manda uma? 👀',at:0},
  {x:`<div class="q" style="width:170px;height:170px;font-size:110px;border-color:#3797f0">?</div>`,o:1,at:1.9}],'7:03',
  t>1.6&&t<2.2?`<div class="finger" style="left:520px;top:${1400-(1400-1080)*ease((t-1.6)/0.3)}px"></div>`:'');},
// gallery 1.3s then formatura 4.6s
gallery(t){
  let cells=''; for(let i=0;i<15;i++){const isQ=i==7; const c=['#2d3240','#5b4636','#7d8794','#3e4a5c','#8a6b52'][i%5];
    cells+=`<div style="height:150px;background:${isQ?'#fff':c};display:flex;align-items:center;justify-content:center">${isQ?`<div class="q" style="width:110px;height:110px;font-size:70px;border:6px solid #3797f0;transform:scale(${t>0.7?1+0.15*Math.sin(cl((t-0.7)/0.4)*Math.PI):1})">?</div>`:`<div style="width:60%;height:10px;background:rgba(255,255,255,.25);border-radius:5px"></div>`}</div>`;}
  const sc=-600+600*ease(t/0.7);
  return bg()+`<div class="phone"><div class="notch"></div><div class="sbar"><span>7:02</span><span>▮▮ ◔</span></div>
  <div style="padding:10px 20px;font-weight:800;font-size:24px">Fotos <span style="float:right;font-size:15px;color:#888;font-weight:600">2.417 itens</span></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;transform:translateY(${sc}px)">${cells}${cells}</div></div>`;
},
formatura(t){
  let conf=''; for(let i=0;i<40;i++){const x=(i*97)%720, y=((i*173)%1280 + t*120*(1+(i%3)))%1280; conf+=`<div style="position:absolute;left:${x}px;top:${y}px;width:14px;height:8px;background:${['#ffd23f','#ed2b4a','#fff','#3797f0'][i%4]};transform:rotate(${i*40+t*200}deg)"></div>`;}
  let bal=''; [[60,300,'#ffd23f'],[150,240,'#ed2b4a'],[600,280,'#fff'],[540,220,'#ffd23f'],[640,380,'#ed2b4a'],[30,420,'#fff']].forEach(([x,y,c],i)=>{bal+=`<div style="position:absolute;left:${x}px;top:${y+10*Math.sin(t*2+i)}px;width:80px;height:100px;border-radius:50%;background:${c};box-shadow:inset -10px -10px 0 rgba(0,0,0,.12)"></div>`});
  const p=pop(t/0.5), z=1+0.04*t;
  return `<div style="position:absolute;inset:0;background:linear-gradient(#22305a,#1a2547);transform:scale(${z})">
  <div style="position:absolute;left:0;right:0;top:0;height:120px;background:repeating-linear-gradient(90deg,#c9a227 0 40px,#e3bd3d 40px 80px);clip-path:polygon(0 0,100% 0,100% 60%,95% 100%,90% 60%,85% 100%,80% 60%,75% 100%,70% 60%,65% 100%,60% 60%,55% 100%,50% 60%,45% 100%,40% 60%,35% 100%,30% 60%,25% 100%,20% 60%,15% 100%,10% 60%,5% 100%,0 60%)"></div>
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 30px,transparent 30px 70px)"></div>
  ${bal}${conf}
  <div style="position:absolute;left:150px;top:150px;width:420px;padding:14px;background:#f6ecd0;border:5px solid #1b1b1b;border-radius:12px;text-align:center;font-weight:900;font-size:40px;color:#1b2547;transform:scale(${p})">FORMATURA 2018</div>
  <div style="position:absolute;left:130px;top:720px;width:460px;height:640px;background:#22356b;border-radius:200px 200px 0 0;border:5px solid #111"><div style="position:absolute;left:190px;top:0;width:80px;height:330px;background:#fff;clip-path:polygon(0 0,100% 0,50% 100%)"></div><div style="position:absolute;left:212px;top:30px;width:36px;height:260px;background:#d23a2e;clip-path:polygon(20% 0,80% 0,100% 85%,50% 100%,0 85%)"></div></div>
  <div class="q" style="position:absolute;left:160px;top:330px;width:400px;height:400px;font-size:280px;border-width:14px;transform:scale(${p})">?</div></div>`;
},
ship(t){
  const sx = -420 + 470*ease(t/2.2);
  let waves=''; for(let r=0;r<6;r++){waves+=`<path d="M${-80+((t*60*(r%2?1:-1))%80)} ${40+r*90} ${Array.from({length:12},(_,k)=>`q20 -18 40 0 t40 0`).join(' ')}" stroke="rgba(255,255,255,.35)" stroke-width="5" fill="none"/>`;}
  const bub=(at,html,o)=>t<at?'':`<div style="position:absolute;${o?'right:40px':'left:40px'};top:${o?330:170}px;max-width:560px;padding:20px 26px;background:${o?'#3797f0':'#fff'};color:${o?'#fff':'#111'};border-radius:26px;font-size:30px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.2);transform:scale(${pop((t-at)/0.3)});transform-origin:${o?'right':'left'} top">${html}</div>`;
  return `<div style="position:absolute;inset:0;background:linear-gradient(#8fd0ef,#d8f0fb 55%)"></div>
  <div style="position:absolute;left:80px;top:${110}px;width:150px;height:46px;background:#fff;border-radius:30px"></div><div style="position:absolute;left:470px;top:200px;width:190px;height:52px;background:#fff;border-radius:30px"></div>
  <div style="position:absolute;left:${sx}px;top:560px;width:560px;height:300px">
   <div style="position:absolute;left:300px;top:0;width:44px;height:90px;background:#d23a2e;border:5px solid #1b1b1b"></div>
   <div style="position:absolute;left:110px;top:80px;width:360px;height:90px;background:#fff;border:5px solid #1b1b1b;border-radius:10px;display:flex;gap:14px;align-items:center;padding-left:24px">${'<i style="width:22px;height:22px;border-radius:50%;background:#2f4a7a;display:block"></i>'.repeat(10)}</div>
   <div style="position:absolute;left:0;top:165px;width:560px;height:120px;background:#24407a;border:5px solid #1b1b1b;clip-path:polygon(0 0,100% 0,92% 100%,6% 100%);color:#fff;font-weight:900;font-size:24px;text-align:right;padding:40px 70px 0 0">MAR ALTO</div>
  </div>
  <div style="position:absolute;left:0;right:0;top:820px;bottom:0;background:#2a8fb8;transform:translateY(${6*Math.sin(t*3)}px)"><svg width="800" height="520" style="position:absolute;left:0;top:0">${waves}</svg></div>
  ${bub(2.75,'⚓ desembarco em Santos dia 30.<br><span style="color:#e1306c">sai comigo?</span>')}${bub(3.85,'SIM!!! 😁',1)}`;
},
final(t){
  const face=(x,flip)=>`<div style="position:absolute;left:${x}px;top:560px;width:270px;height:270px;border-radius:50%;overflow:hidden;border:7px solid #fff;background:#fff;transform:scale(${pop((t-0.2)/0.4)}) ${flip?'scaleX(-1)':''}"><img src="claudio-rosto.jpg" style="position:absolute;left:-210px;top:-10px;height:300px"></div>`;
  const bar=Math.round(3);
  return `<div style="position:absolute;inset:0;background:#e8a91f"></div><div style="position:absolute;inset:0;background:#d2393a;clip-path:polygon(56% 0,100% 0,100% 100%,44% 100%)"></div>
  <div style="position:absolute;left:44%;top:0;width:12%;height:100%;background:linear-gradient(105deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%)"></div>
  <div style="position:absolute;left:40px;top:90px;display:flex;gap:16px;transform:translateY(${-200+200*ease(t/0.4)}px)">
   <div class="badge" style="width:190px;padding:10px"><div style="font-size:16px">FALTAM</div><div style="font-size:42px;color:#ffd23f;line-height:1.1">30 DIAS</div></div>
   <div class="badge" style="width:440px;padding:14px 18px;text-align:left"><div style="font-size:16px">PARECIDO COM A FOTO</div><div style="display:flex;align-items:center;gap:12px;margin-top:8px"><div style="flex:1;height:18px;background:#333c55;border-radius:9px"><div style="width:${bar}%;height:100%;background:#ed2b4a;border-radius:9px"></div></div><span style="color:#ed2b4a;font-size:34px">3%</span></div></div></div>
  <div style="position:absolute;left:150px;top:290px;width:420px;padding:10px;background:#131a2c;border:4px solid #fff;border-radius:14px;color:#fff;text-align:center;font-weight:800;font-size:30px;transform:scale(${pop((t-0.4)/0.4)})">COMENTE UMA PALAVRA</div>
  <div style="position:absolute;left:30px;top:400px;width:300px;text-align:center;color:#fff;font-weight:900;font-size:64px;text-shadow:0 5px 0 #1b1b1b">BARBA<div style="font-size:20px;font-weight:700;text-shadow:none">custa 1 dia</div></div>
  <div style="position:absolute;right:30px;top:400px;width:300px;text-align:center;color:#fff;font-weight:900;font-size:64px;text-shadow:0 5px 0 #1b1b1b">DENTE<div style="font-size:20px;font-weight:700;text-shadow:none">custa 3 dias</div></div>
  ${face(45,0)}${face(405,1)}
  <div style="position:absolute;left:310px;top:650px;width:100px;height:100px;border-radius:50%;background:#131a2c;border:5px solid #fff;color:#ffd23f;font-weight:900;font-size:38px;display:flex;align-items:center;justify-content:center;transform:scale(${pop((t-0.6)/0.3)})">OU</div>
  <div style="position:absolute;left:120px;top:540px;font-size:70px;transform:rotate(-20deg)">🪒</div><div style="position:absolute;right:120px;top:540px;font-size:70px">🦷</div>`;
},
panic(t){
  const sx=8*Math.sin(t*55), sy=6*Math.cos(t*47), z=1.9+0.3*ease(t/1.2);
  return `<img src="panic.jpg" style="position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover;transform:translate(${sx}px,${sy}px) scale(${z});transform-origin:27% 31%">
  <div style="position:absolute;inset:0;box-shadow:inset 0 0 220px 60px rgba(200,0,30,${0.35+0.25*Math.sin(t*12)})"></div>`;
}
};
window.render=(name,t)=>{S.innerHTML=scenes[name](t);};
</script></body></html>
